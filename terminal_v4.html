<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crypto Intelligence Terminal · 资金流与市场情报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#07111f;--bg2:#0a1626;--panel:#0d1b2d;--panel2:#10233a;--line:#1c3048;--text:#dce7f5;--muted:#7e93ab;--green:#36d399;--red:#ff6b6b;--amber:#f6c15b;--blue:#5fa8ff;--cyan:#4fd1c5;--purple:#9f8cff;--shadow:0 12px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#06101d,#081321 45%,#07111f);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topline{display:flex;align-items:center;gap:18px;padding:10px 16px}.brand{font-weight:800;letter-spacing:.08em;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.04em;margin-top:2px}.nav{display:flex;gap:4px;overflow:auto;scrollbar-width:none;flex:1}.nav button{background:transparent;border:1px solid transparent;color:#9eb0c4;padding:8px 10px;border-radius:7px;white-space:nowrap}.nav button:hover,.nav button.active{color:#fff;background:#102138;border-color:#1d3553}.righttop{display:flex;align-items:center;gap:8px}.search{background:#0b192a;border:1px solid #203751;color:#dce7f5;border-radius:7px;padding:8px 10px;width:160px}.status{display:flex;align-items:center;gap:6px;border:1px solid #1c354f;border-radius:7px;padding:7px 9px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#6f7f91}.dot.ok{background:var(--green);box-shadow:0 0 12px rgba(54,211,153,.6)}.dot.warn{background:var(--amber)}
.main{padding:14px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.content{min-width:0}.side{min-width:0}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel,.card{background:linear-gradient(180deg,rgba(14,30,49,.98),rgba(10,23,38,.98));border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.card{padding:12px}.panel{padding:12px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.title{font-size:15px;font-weight:750}.sub{color:var(--muted);font-size:11px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.big{font-size:25px;font-weight:800;margin-top:4px}.meta{color:#92a7bd;font-size:11px;margin-top:6px}.up{color:var(--green)}.down{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;border:1px solid #25415f;color:#8ea5bc;font-size:10px}.pill.high{color:#ffd1d1;border-color:#6e3241;background:#27151c}.pill.medium{color:#ffe7af;border-color:#6b5427;background:#241c0d}.pill.info{color:#bde6ff;border-color:#285a78;background:#0d2333}.pill.ops{color:#bcc8d4;border-color:#3b4958;background:#121b24}.live{color:var(--green)}.cfg{color:var(--amber)}.muted{color:var(--muted)}.section{margin-bottom:12px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.toolbar input,.toolbar select{background:#0a1829;color:#dce7f5;border:1px solid #1e3550;border-radius:6px;padding:7px 9px}.toolbar .btn{border:1px solid #29435f;background:#102339;color:#cbd8e6;border-radius:6px;padding:7px 10px}.toolbar .btn.active{background:#173350;border-color:#2c5a87;color:#fff}.chartbox{height:260px}.chartbox.sm{height:190px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:7px}.tbl{width:100%;border-collapse:collapse;min-width:780px}.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid #172b42;text-align:left;white-space:nowrap}.tbl th{font-size:10px;color:#7f95ac;background:#0b1929;position:sticky;top:0}.tbl td{font-size:11px}.tbl tr:hover td{background:#0f2339}.timeline{display:flex;flex-direction:column;gap:7px;max-height:510px;overflow:auto}.event{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;padding:8px 9px;border:1px solid #1a2f46;background:#0b1929;border-radius:7px}.event .time{color:#748ba4;font-size:10px}.event .evtmain{min-width:0}.event .headline{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event .desc{color:#8ba0b6;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank{display:grid;gap:7px}.rankrow{display:grid;grid-template-columns:38px 70px 1fr 70px;align-items:center;gap:7px;font-size:11px}.bar{height:6px;background:#142a43;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4d9eff,#6fd6cb);border-radius:99px}.sidepanel{margin-bottom:12px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.statline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #1b3148}.health{display:grid;gap:6px}.healthrow{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:#0a1828;border:1px solid #173049;border-radius:6px}.empty{padding:24px;text-align:center;color:#657d96;border:1px dashed #1d344d;border-radius:7px}.kpiNote{color:#8fa4b8;font-size:10px;margin-top:5px}.source{font-size:9px;padding:3px 6px;border:1px solid #22405b;border-radius:999px;color:#81a1bc}.source.live{color:#68dda7;border-color:#235b43}.source.warn{color:#f3c56b;border-color:#5b4a28}.source.bad{color:#ff9090;border-color:#5e2e39}.miniGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.mini{padding:9px;background:#0a1828;border:1px solid #18304a;border-radius:7px}.mini .v{font-size:15px;font-weight:750;margin-top:3px}.small{font-size:10px}.tag{display:inline-block;padding:2px 6px;border:1px solid #29445e;border-radius:999px;color:#9eb1c5;font-size:9px;margin:2px}.danger{border-color:#743742!important;background:#21131a!important}.okbox{border-color:#255942!important}.footerNote{color:#667f98;font-size:10px;line-height:1.6}.link{color:#71b3ff;text-decoration:none}
@media (max-width:1100px){.main{grid-template-columns:1fr}.side{display:none}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.miniGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:700px){.topline{flex-wrap:wrap}.righttop{width:100%}.search{flex:1}.grid3,.grid2,.grid4{grid-template-columns:1fr}.miniGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:10px}.nav{order:3;flex-basis:100%}}
</style></head>
<body><div class="shell">
<header class="top"><div class="topline"><div class="brand">CRYPTO INTELLIGENCE<small>链上 · 行情 · 资金流 · 异常实时监控</small></div><div class="nav" id="nav"></div><div class="righttop"><input id="search" class="search" placeholder="币种检索，如 BTC"/><div class="status"><span id="dot" class="dot"></span><span id="conn">CONNECTING</span></div></div></div></header>
<main class="main"><div class="content" id="content"></div><aside class="side" id="side"></aside></main></div>
<script>
const API_KEY='cit_api_base'; let API=localStorage.getItem(API_KEY)||location.origin; let SNAP={}; let page='overview'; let charts={};
const MODS=[['overview','总览'],['whale','鲸鱼监控'],['pool','监控池'],['spread','价差与异动'],['flow','资金流'],['sentiment','市场情绪'],['macro','宏观周期'],['etf','ETF 资金流'],['options','加密期权'],['system','系统管理']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=x=>{x=Number(x||0);if(!x)return'—';const a=Math.abs(x);const p=x<0?'-':'';return p+(a>=1e9?'$'+(a/1e9).toFixed(2)+'B':a>=1e6?'$'+(a/1e6).toFixed(2)+'M':a>=1e3?'$'+(a/1e3).toFixed(1)+'K':'$'+a.toFixed(0))};
const num=x=>{x=Number(x||0);return x>=1e9?(x/1e9).toFixed(2)+'B':x>=1e6?(x/1e6).toFixed(2)+'M':x>=1e3?(x/1e3).toFixed(1)+'K':x.toFixed(2)};
const pct=x=>{x=Number(x||0);return (x>=0?'+':'')+x.toFixed(2)+'%'};
const ts=x=>x?new Date(Number(x)).toISOString().slice(11,19)+' UTC':'--';
const sev=e=>`<span class="pill ${e}">${e==='high'?'高危':e==='medium'?'中等':e==='ops'?'运维':'提示'}</span>`;
function initNav(){document.getElementById('nav').innerHTML=MODS.map(([id,name])=>`<button data-page="${id}" class="${id===page?'active':''}">${name}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));}
function showPage(p){page=p;initNav();render();}
function kpi(label,value,meta='',cls=''){return `<div class="card"><div class="label">${label}</div><div class="big ${cls}">${value}</div><div class="meta">${meta}</div></div>`}
function panel(title,body,right=''){return `<section class="panel section"><div class="panelhead"><div class="title">${title}</div><div class="sub">${right}</div></div>${body}</section>`}
function evt(e){return `<div class="event"><div class="time">${ts(e.ts)}</div><div class="evtmain"><div class="headline">${esc(e.title||`${e.direction==='out'?'大额流出':'资金事件'} ${e.symbol||''} ${usd(e.usd)}`)}</div><div class="desc">${esc(e.from_label||'')} → ${esc(e.to_label||'Unknown')} · ${esc(e.chain||'')} · ${e.score??'--'}</div></div>${sev(e.severity||'info')}</div>`}
function overview(){let es=SNAP.events||[], m=SNAP.market||{}, f=SNAP.fearGreed;let out=es.filter(e=>e.direction==='out').reduce((a,e)=>a+Number(e.usd||0),0);let high=es.filter(e=>e.severity==='high').length;let symbols={};es.forEach(e=>{if(e.symbol)symbols[e.symbol]=(symbols[e.symbol]||0)+1});let ranks=Object.entries(symbols).sort((a,b)=>b[1]-a[1]).slice(0,10);return `<div class="grid4 section">${kpi('24H 链上流出',usd(SNAP.metrics?.out24),SNAP.metrics?'接收事件聚合':'等待链上事件','')}${kpi('24H 告警',SNAP.metrics?.events24??'—','去重后事件')}${kpi('高危事件',high,'Score ≥ 8','down')}${kpi('Fear & Greed',f?f.value:'—',f?f.classification:'Alternative.me')}</div>${panel('市场速览',`<div class="miniGrid">${['BTCUSDT','ETHUSDT','SOLUSDT','ZECUSDT','ENAUSDT','NEARUSDT'].map(s=>{let x=m[s]||{};return `<div class="mini"><div class="label">${s.replace('USDT','')}</div><div class="v">${x.price?usd(x.price):'—'}</div><div class="small ${x.change24>=0?'up':'down'}">${x.change24!=null?pct(x.change24):'—'}</div></div>`}).join('')}</div>`,'Binance')}${panel('告警时间线',`<div class="toolbar"><select id="ovSev"><option value="">全部级别</option><option value="high">高</option><option value="medium">中</option><option value="info">提示</option><option value="ops">运维</option></select><input id="ovSym" placeholder="BTC / ETH / ZEC"/></div><div id="ovTimeline" class="timeline"></div>`,'实时')}${panel('高频币种',`<div class="rank">${ranks.length?ranks.map((r,i)=>{let w=Math.round(r[1]/ranks[0][1]*100);return `<div class="rankrow"><span>#${i+1}</span><b>${esc(r[0])}</b><div class="bar"><i style="width:${w}%"></i></div><span>${r[1]}次</span></div>`}).join(''):'<div class="empty">等待事件</div>'}</div>`,'按事件数')}`}
function whale(){return `<div class="grid4 section">${kpi('Binance 流出',usd(SNAP.metrics?.out24),'24H')}${kpi('最大单笔',usd(SNAP.metrics?.maxOut),'当前事件')}${kpi('未知去向',SNAP.metrics?.unknownOut??'—','建议重点复核','amber')}${kpi('连续流出币',SNAP.metrics?.repeatSymbols??'—','24H')}</div>${panel('鲸鱼监控 · Binance 大额流出',`<div class="toolbar"><input id="whSearch" placeholder="币种 / 地址 / 标签"/><select id="whMin"><option value="0">全部金额</option><option value="1000000">≥ $1M</option><option value="5000000">≥ $5M</option><option value="10000000">≥ $10M</option></select><select id="whSev"><option value="">全部级别</option><option value="high">高</option><option value="medium">中</option><option value="info">提示</option></select></div><div id="whaleTable" class="tablewrap"></div>`,'实时链上事件优先')}${panel('地址去向分析',`<div class="grid3"><div class="card"><div class="label">Unknown</div><div class="big">${usd(SNAP.metrics?.unknownUsd)}</div><div class="meta">待识别 / 非交易所</div></div><div class="card"><div class="label">CEX</div><div class="big">${usd(SNAP.metrics?.cexUsd)}</div><div class="meta">转往其他交易所</div></div><div class="card"><div class="label">DeFi / Bridge</div><div class="big">${usd(SNAP.metrics?.defiUsd)}</div><div class="meta">协议、桥、质押等</div></div></div>`,'分类不代表方向')}`}
function pool(){let w=SNAP.watchlist||[];return panel('监控池',`<div class="toolbar"><input id="poolSym" placeholder="输入 BTC / ZEC / ENA"/><input id="poolTh" type="number" value="1000000" step="100000"/><button class="btn active" onclick="addPool()">加入监控</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>币种</th><th>状态</th><th>流出阈值</th><th>TG</th><th>备注</th><th></th></tr></thead><tbody>${w.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${x.enabled?'ON':'OFF'}</td><td>${usd(x.threshold_usd)}</td><td>${x.tg_enabled?'ON':'OFF'}</td><td>${esc(x.notes||'')}</td><td><button class="btn" onclick="delPool('${esc(x.symbol)}')">删除</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">暂无监控币种</div></td></tr>'}</tbody></table></div>`,'自定义阈值 + TG')}
function spread(){let d=SNAP.spread||{};return `<div class="grid4 section">${kpi('BTC 期现',pct(d.BTCUSDT?.basisPct),'Binance Futures - Spot')}${kpi('ETH 期现',pct(d.ETHUSDT?.basisPct),'Binance Futures - Spot')}${kpi('BTC Coinbase Premium',usd(d.BTC?.premium),'Coinbase - Binance','amber')}${kpi('ETH Coinbase Premium',usd(d.ETH?.premium),'Coinbase - Binance')}</div>${panel('价差与异动',`<div class="tablewrap"><table class="tbl"><thead><tr><th>标的</th><th>Binance Spot</th><th>Binance Futures</th><th>期现%</th><th>Coinbase</th><th>溢价%</th><th>状态</th></tr></thead><tbody>${['BTC','ETH','SOL'].map(s=>{let x=d[s+'USDT']||{},p=d[s]||{};return `<tr><td><b>${s}</b></td><td>${usd(x.spot)}</td><td>${usd(x.futures)}</td><td class="${(x.basisPct||0)>=0?'up':'down'}">${pct(x.basisPct||0)}</td><td>${usd(p.coinbase)}</td><td>${pct(p.premiumPct||0)}</td><td>${Math.abs(x.basisPct||0)>0.5?'<span class="pill medium">异常</span>':'<span class="pill info">正常</span>'}</td></tr>`}).join('')}</tbody></table></div>`,'实时计算')}`}
function flow(){return `<div class="grid3 section">${kpi('24H 记录流出',usd(SNAP.metrics?.out24),'基于已接收链上事件')}${kpi('24H 记录流入',usd(SNAP.metrics?.in24),'基于已接收链上事件')}${kpi('净流量',usd((SNAP.metrics?.in24||0)-(SNAP.metrics?.out24||0)),'不等于全网 CEX 净流量')}</div>${panel('资金流',`<div class="toolbar"><button class="btn active" data-flow="24" onclick="setFlow('24')">24H</button><button class="btn" data-flow="4" onclick="setFlow('4')">4H</button><button class="btn" data-flow="1" onclick="setFlow('1')">1H</button></div><div class="chartbox"><canvas id="flowChart"></canvas></div>`,'事件聚合')}`}
function sentiment(){let d=SNAP.derivatives||{};return `<div class="grid3 section">${['BTCUSDT','ETHUSDT','SOLUSDT'].map(s=>{let x=d[s]||{};return `<div class="panel"><div class="panelhead"><div class="title">${s}</div><span class="source live">BINANCE</span></div><div class="grid2"><div><div class="label">Funding</div><div class="big">${x.funding!=null?pct(x.funding*100):'—'}</div></div><div><div class="label">OI</div><div class="big">${num(x.oi)}</div></div></div><div class="meta">Global L/S ${x.longShort?x.longShort.toFixed(3):'—'} · Top Trader ${x.topLongShort?x.topLongShort.toFixed(3):'—'}</div></div>`}).join('')}</div>${panel('强平与情绪',`<div class="grid2"><div class="card"><div class="label">最新全市场强平</div><div class="big">${usd(SNAP.metrics?.liq24)}</div><div class="meta">Binance !forceOrder@arr · 实时推送</div></div><div class="card"><div class="label">Fear & Greed</div><div class="big">${SNAP.fearGreed?.value??'—'}</div><div class="meta">${esc(SNAP.fearGreed?.classification||'')}</div></div></div>`,'实时')}`}
function macro(){let m=SNAP.macro||{};return panel('宏观周期',`<div class="grid4"><div class="card"><div class="label">DXY</div><div class="big">${m.DXY?.value??'—'}</div><div class="meta">${m.DXY?.change!=null?pct(m.DXY.change):''}</div></div><div class="card"><div class="label">2Y UST</div><div class="big">${m.DGS2?.value?m.DGS2.value.toFixed(2)+'%':'—'}</div><div class="meta">${m.DGS2?.changeBps!=null?(m.DGS2.changeBps>=0?'+':'')+m.DGS2.changeBps.toFixed(1)+'bp':''}</div></div><div class="card"><div class="label">10Y UST</div><div class="big">${m.DGS10?.value?m.DGS10.value.toFixed(2)+'%':'—'}</div><div class="meta">FRED</div></div><div class="card"><div class="label">10Y-2Y</div><div class="big">${m.T10Y2Y?.value!=null?m.T10Y2Y.value.toFixed(2)+'%':'—'}</div><div class="meta">期限利差</div></div></div><div class="note">MVRV / NUPL / SOPR 预留独立链上适配器，不用没有数据的占位数字冒充实时值。</div>`,'FRED + 可插拔链上源')}
function etf(){let e=SNAP.etf||{};return panel('ETF 资金流',`<div class="grid3"><div class="card"><div class="label">BTC ETF 最近交易日</div><div class="big">${usd(e.BTC?.latestNet)}</div><div class="meta">${esc(e.BTC?.date||'尚未抓取')}</div></div><div class="card"><div class="label">ETH ETF 最近交易日</div><div class="big">${usd(e.ETH?.latestNet)}</div><div class="meta">${esc(e.ETH?.date||'尚未抓取')}</div></div><div class="card"><div class="label">数据源</div><div class="big">${e.source?'LIVE':'CONFIG'}</div><div class="meta">Farside daily flow · 非盘中 tick</div></div></div><div class="chartbox sm"><canvas id="etfChart"></canvas></div>`,'日频实时更新')}
function options(){let o=SNAP.options||{};return `<div class="grid2">${['BTC','ETH'].map(s=>{let x=o[s]||{};return `<div class="panel"><div class="panelhead"><div class="title">${s} Options</div><span class="source live">DERIBIT</span></div><div class="grid2"><div><div class="label">Open Interest</div><div class="big">${num(x.openInterest)}</div></div><div><div class="label">Put / Call</div><div class="big">${x.putCall!=null?x.putCall.toFixed(3):'—'}</div></div></div><div class="meta">Instruments ${x.instruments||0}</div></div>`}).join('')}</div>`}
function system(){let h=SNAP.health||{};return panel('系统管理',`<div class="health">${Object.entries(h).map(([k,v])=>`<div class="healthrow"><span>${esc(k)}</span><b class="${v?'up':'amber'}">${v?'ONLINE':'CONFIG / OFFLINE'}</b></div>`).join('')}</div><div style="height:10px"></div><div class="toolbar"><span class="pill info">静态快照</span><span class="sub" style="margin-left:8px">数据：data/terminal_v4.json · 服务端定时抓取 · 本页只读</span><button class="btn" onclick="tgTest()">TG 状态</button><button class="btn" onclick="refresh()">刷新</button></div><div class="footerNote">前端可以部署在 GitHub Pages；实时 Webhook、Telegram、数据库和链上监听必须运行在服务器。不要把 Telegram Token / API Key 写入前端。</div>`,'数据源与通知')}
function eventsPage(){let rows=SNAP.events||[];let sym=document.getElementById('search').value.trim().toUpperCase();if(sym)rows=rows.filter(e=>String(e.symbol||'').toUpperCase().includes(sym));return rows}
function bindOverview(){let render=()=>{let rows=eventsPage();let s=document.getElementById('ovSev')?.value||'',q=document.getElementById('ovSym')?.value.trim().toUpperCase()||'';rows=rows.filter(e=>(!s||e.severity===s)&&(!q||String(e.symbol||'').includes(q)));document.getElementById('ovTimeline').innerHTML=rows.slice(0,80).map(evt).join('')||'<div class="empty">暂无匹配事件</div>'};['ovSev','ovSym'].forEach(id=>document.getElementById(id)?.addEventListener(id.endsWith('Sym')?'input':'change',render));render()}
function bindWhale(){let render=()=>{let q=document.getElementById('whSearch')?.value.trim().toUpperCase()||'',mn=Number(document.getElementById('whMin')?.value||0),s=document.getElementById('whSev')?.value||'';let rows=(SNAP.events||[]).filter(e=>e.direction==='out'&&Number(e.usd||0)>=mn&&( !q || `${e.symbol} ${e.from_label} ${e.to_label} ${e.from_address} ${e.to_address}`.toUpperCase().includes(q))&&(!s||e.severity===s));document.getElementById('whaleTable').innerHTML=`<table class="tbl"><thead><tr><th>时间</th><th>币种</th><th>数量</th><th>USD</th><th>链</th><th>来源</th><th>接收方</th><th>类型</th><th>Score</th></tr></thead><tbody>${rows.slice(0,150).map(e=>`<tr><td>${ts(e.ts)}</td><td><b>${esc(e.symbol)}</b></td><td>${num(e.amount)}</td><td>${usd(e.usd)}</td><td>${esc(e.chain||'')}</td><td>${esc(e.from_label||'')}</td><td>${esc(e.to_label||'Unknown')}</td><td>${esc(e.category||'链上转账')}</td><td>${e.score??'—'}</td></tr>`).join('')||'<tr><td colspan="9"><div class="empty">暂无链上事件</div></td></tr>'}</tbody></table>`};['whSearch','whMin','whSev'].forEach(id=>document.getElementById(id)?.addEventListener(id==='whSearch'?'input':'change',render));render()}

async function delPool(s){alert('静态页只读：监控池在服务端配置')}
async function tgTest(){const h=(SNAP.health||{})['Telegram'];alert(h?'服务端 Telegram 已配置（静态页只读，测试请走服务端）':'服务端 Telegram 未配置')}
function saveApi(){alert('静态页只读：不使用后端地址')}
function setFlow(h){flowHours=String(h);document.querySelectorAll('[data-flow]').forEach(b=>b.classList.toggle('active',b.dataset.flow===flowHours));renderFlow()}
let flowHours='24';
let _STATIC=null;
async function _loadData(){if(_STATIC)return _STATIC;_STATIC=await fetch('data/terminal_v4.json?z='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});return _STATIC}
async function api(path,opt){const p=String(path);
 if(p.indexOf('/api/snapshot')===0){_STATIC=null;return await _loadData()}
 if(p.indexOf('/api/flow/series')>=0){const d=await _loadData();const h=(/[?&]hours=(\d+)/.exec(p)||[])[1]||'24';return (d.flowSeries||{})[h]||{labels:[],outflow:[],inflow:[]}}
 if(p.indexOf('/api/etf/series')>=0){const d=await _loadData();return d.etfSeries||{labels:[],btc:[],eth:[]}}
 throw new Error('静态站：无此接口 '+p)}
function metrics(){let es=SNAP.events||[],now=Date.now(),out24=0,in24=0,maxOut=0,unknownUsd=0,cexUsd=0,defiUsd=0,liq24=0;es.forEach(e=>{if(now-Number(e.ts)<86400000){if(e.direction==='out')out24+=Number(e.usd||0);else if(e.direction==='in')in24+=Number(e.usd||0);maxOut=Math.max(maxOut,e.direction==='out'?Number(e.usd||0):0);if(e.direction==='out'){let t=(e.to_label||'').toLowerCase();if(!t||t.includes('unknown'))unknownUsd+=Number(e.usd||0);else if(/binance|okx|bybit|gate|coinbase|kraken|kucoin|bitget/.test(t))cexUsd+=Number(e.usd||0);else if(/aave|uniswap|pancake|curve|bridge|wormhole|staking|lido/.test(t))defiUsd+=Number(e.usd||0)}}if(e.category==='清算')liq24+=Number(e.usd||0)});let reps={};es.filter(e=>e.direction==='out'&&now-Number(e.ts)<86400000).forEach(e=>reps[e.symbol]=(reps[e.symbol]||0)+1);let repeatSymbols=Object.values(reps).filter(x=>x>=3).length;SNAP.metrics={out24,in24,maxOut,unknownUsd,cexUsd,defiUsd,repeatSymbols,events24:es.filter(e=>now-Number(e.ts)<86400000).length,liq24:(SNAP.liquidations||[]).filter(x=>now-Number(x.time)<86400000).reduce((a,x)=>a+Number(x.usd||0),0)};}
async function renderFlow(){let x=await api('/api/flow/series?hours='+(typeof flowHours!=='undefined'?flowHours:'24'));let c=document.getElementById('flowChart');if(!c)return;if(charts.flow)charts.flow.destroy();charts.flow=new Chart(c,{type:'line',data:{labels:x.labels,datasets:[{label:'Outflow USD',data:x.outflow,borderColor:'#5fa8ff',backgroundColor:'rgba(95,168,255,.15)',fill:true,tension:.25,pointRadius:0},{label:'Inflow USD',data:x.inflow,borderColor:'#36d399',backgroundColor:'rgba(54,211,153,.08)',fill:true,tension:.25,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a9b9cb'}}},scales:{x:{ticks:{color:'#71859a'},grid:{color:'#12283f'}},y:{ticks:{color:'#71859a',callback:v=>usd(v)},grid:{color:'#12283f'}}}}});}
async function renderEtf(){let x=await api('/api/etf/series?days=30');let c=document.getElementById('etfChart');if(!c)return;if(charts.etf)charts.etf.destroy();charts.etf=new Chart(c,{type:'bar',data:{labels:x.labels,datasets:[{label:'BTC ETF Net Flow',data:x.btc,backgroundColor:x.btc.map(v=>v>=0?'rgba(54,211,153,.65)':'rgba(255,107,107,.65)')},{label:'ETH ETF Net Flow',data:x.eth,backgroundColor:x.eth.map(v=>v>=0?'rgba(95,168,255,.55)':'rgba(159,140,255,.55)')}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a9b9cb'}}},scales:{x:{ticks:{color:'#71859a'},grid:{display:false}},y:{ticks:{color:'#71859a',callback:v=>'$'+v+'M'},grid:{color:'#12283f'}}}}});}
async function render(){metrics();document.getElementById('content').innerHTML=page==='overview'?overview():page==='whale'?whale():page==='pool'?pool():page==='spread'?spread():page==='flow'?flow():page==='sentiment'?sentiment():page==='macro'?macro():page==='etf'?etf():page==='options'?options():system();document.getElementById('side').innerHTML=`${panel('数据源状态',`<div class="health">${Object.entries(SNAP.health||{}).map(([k,v])=>`<div class="healthrow"><span>${esc(k)}</span><b class="${v?'up':'amber'}">${v?'OK':'—'}</b></div>`).join('')}</div>`,'LIVE / CONFIG')}${panel('最新告警',`<div class="timeline">${(SNAP.events||[]).slice(0,14).map(evt).join('')||'<div class="empty">等待事件…</div>'}</div>`,'UTC')}`;if(page==='overview')bindOverview();if(page==='whale')bindWhale();if(page==='flow')renderFlow();if(page==='etf')renderEtf()}
async function refresh(){try{SNAP=await api('/api/snapshot?nocache='+Date.now());document.getElementById('dot').className='dot ok';document.getElementById('conn').textContent='LIVE';render()}catch(e){document.getElementById('dot').className='dot warn';document.getElementById('conn').textContent='OFFLINE';}}
function sse(){/* 静态站：无 SSE，由 30s 轮询 refresh() 兜住 */}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){showPage('whale')}});initNav();refresh();setInterval(refresh,60000);
