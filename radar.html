<style>

.top{position:sticky;top:0;z-index:50;background:rgba(7,12,19,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topline{display:flex;align-items:center;gap:14px;padding:10px 16px}.brand{font-weight:850;letter-spacing:.08em;white-space:nowrap}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.03em;margin-top:2px}.nav{display:flex;gap:4px;overflow:auto;flex:1;scrollbar-width:none}.nav button{border:1px solid transparent;background:transparent;color:#8fa2b8;padding:7px 10px;border-radius:7px;font-size:13px;white-space:nowrap}.nav button.active{background:#122238;border-color:#28415d;color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}.nav button:hover{background:#0e1a29;color:#e8f1fb}.topright{display:flex;align-items:center;gap:8px}.search{width:170px;background:#0b121b;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;color:var(--text);outline:none}.search:focus{border-color:#356389}.livebox{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:7px 9px;border-radius:7px;white-space:nowrap}.led{width:7px;height:7px;border-radius:50%;background:#66788c}.led.live{background:var(--green);box-shadow:0 0 12px rgba(51,211,145,.65)}.led.warn{background:var(--amber)}.shell{max-width:1680px;margin:auto;padding:14px 16px 28px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar-left,.toolbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn,.select,.input{background:#0b1420;border:1px solid var(--line2);color:var(--text);padding:7px 9px;border-radius:6px}.btn:hover{background:#122135}.btn.primary{background:#122b45;border-color:#2f5f8e}.btn.on{color:#fff;border-color:#36688f;background:#15324e}.hint{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.panel,.card{background:linear-gradient(180deg,rgba(13,21,31,.98),rgba(9,15,23,.98));border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.card{padding:11px}.panel{padding:12px}.section{margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.title{font-size:14px;font-weight:750}.sub{font-size:10px;color:var(--muted)}.label{font-size:10px;color:var(--muted);letter-spacing:.04em}.big{font-size:24px;font-weight:850;margin-top:4px;letter-spacing:-.02em}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.meta{font-size:10px;color:#91a5ba;margin-top:5px}.up{color:var(--green)}.down{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 7px;font-size:10px;border:1px solid #27415d;background:#0d1a29;color:#9db1c5}.pill.high{border-color:#6d2f3b;background:#24141a;color:#ffb3bc}.pill.medium{border-color:#6a5228;background:#261e0d;color:#f8dda6}.pill.info{border-color:#285577;background:#0c2132;color:#9bd8ff}.pill.ops{border-color:#3b4858;background:#121a22;color:#adb9c5}.score.high{color:#ff7d8a}.score.medium{color:#f6cf74}.score.info{color:#7cc0ff}.source{font-size:9px;border:1px solid #2a425c;border-radius:99px;padding:2px 6px;color:#8fa7bd}.source.ok{color:#6ee0a5;border-color:#23563f}.source.warn{color:#f1ca71;border-color:#5a4723}.metricbar{height:7px;background:#142132;border-radius:99px;overflow:hidden}.metricbar i{display:block;height:100%;background:linear-gradient(90deg,#4f9cff,#52d7c2);border-radius:99px}.kpi.hot{border-top:2px solid var(--red)}.kpi.flow{border-top:2px solid var(--blue)}.kpi.net{border-top:2px solid var(--cyan)}.kpi.unknown{border-top:2px solid var(--amber)}.kpi.events{border-top:2px solid var(--purple)}
.chart{height:270px}.chart.sm{height:210px}.chart canvas{width:100%!important;height:100%!important}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:7px}.table{width:100%;border-collapse:collapse;min-width:860px}.table th,.table td{padding:8px 9px;border-bottom:1px solid #162536;text-align:left;white-space:nowrap}.table th{position:sticky;top:0;background:#0b141f;z-index:2;color:#8195aa;font-size:10px}.table th.sort{cursor:pointer}.table th.sort:hover{color:#bcd2e8}.table td{font-size:11px}.table tr:hover td{background:#0d1c2b}.addr{max-width:155px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}.click{cursor:pointer}.click:hover{text-decoration:underline}.details{display:none;background:#09121c;border-bottom:1px solid #1a2a3a}.details.open{display:table-row}.details td{padding:10px 12px}.detailgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.detailbox{padding:8px;background:#0b1724;border:1px solid #1a3047;border-radius:6px}.detailbox .v{margin-top:3px;font-size:11px;word-break:break-all}.timeline{display:flex;flex-direction:column;gap:7px;max-height:520px;overflow:auto}.event{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 8px;background:#0b1723;border:1px solid #17293b;border-radius:7px}.event:hover{border-color:#27415c}.etime{font-size:10px;color:#758ba2}.headline{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:10px;color:#869bb0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:24px;text-align:center;color:#6d8298;border:1px dashed #1f344a;border-radius:7px}.rank{display:flex;flex-direction:column;gap:7px}.rankrow{display:grid;grid-template-columns:26px 50px minmax(0,1fr) 82px;align-items:center;gap:7px}.rankrow .sym{font-weight:750}.rankrow .amt{text-align:right;font-size:10px}.bar2{height:7px;background:#122236;border-radius:99px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#4e9cff,#53d3c0)}.bar2.red i{background:linear-gradient(90deg,#ff6778,#ffb067)}.twocol{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:9px}.anomalygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.anomaly{padding:9px;background:#0a1622;border:1px solid #1b2f44;border-radius:7px}.anomaly .sym{font-size:12px;font-weight:800}.valueRow{display:flex;justify-content:space-between;gap:8px;margin-top:4px}.mini{font-size:10px;color:#95a9bc}.footer{padding:12px 2px;color:#627990;font-size:10px;line-height:1.6}.footer strong{color:#8aa0b6}.toast{position:fixed;right:18px;bottom:18px;background:#0e1b29;border:1px solid #2b4968;color:#d7e7f7;border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);display:none;z-index:99}.toast.show{display:block}.radar{height:270px}.radarLegend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:#8fa3b8;margin-top:7px}.dotlg{display:inline-flex;align-items:center;gap:5px}.dotlg i{width:7px;height:7px;border-radius:50%;display:inline-block}.sidePanel{margin-bottom:12px}.health{display:grid;gap:6px}.healthrow{display:flex;justify-content:space-between;align-items:center;background:#0a1622;border:1px solid #182d43;border-radius:6px;padding:7px 8px}.notice{padding:9px 10px;background:#0b1724;border:1px solid #22384e;border-radius:7px;color:#93a7bb;font-size:10px;line-height:1.6}.modal{position:fixed;inset:0;background:rgba(2,6,10,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}.modal.show{display:flex}.modalbox{width:min(980px,96vw);max-height:90vh;overflow:auto;background:#0b141f;border:1px solid #2b4158;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.45);padding:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.close{background:transparent;border:0;color:#93a5b8;font-size:22px}.contextGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.contextCard{padding:9px;background:#0a1622;border:1px solid #1b3045;border-radius:7px}.contextCard .v{font-size:16px;font-weight:800;margin-top:4px}.small{font-size:10px}.footerline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:1300px){.layout{grid-template-columns:1fr}.side{display:none}.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.anomalygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.contextGrid,.detailgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.topline{flex-wrap:wrap}.nav{order:3;flex-basis:100%}.topright{width:100%}.search{flex:1}.grid5,.grid4,.grid3,.grid2,.twocol{grid-template-columns:1fr}.anomalygrid,.contextGrid,.detailgrid{grid-template-columns:1fr}.shell{padding:10px}.toolbar{align-items:flex-start;flex-direction:column}.table{min-width:760px}}

<body>
<header class="top"><div class="topline">
  <div class="brand">币安资金流出雷达<small>资金流 · 异常 · 钱包行为 · 行情联动</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="topright"><input id="globalSearch" class="search" placeholder="检索 BTC / ZEC / 钱包…"><div class="livebox"><span id="led" class="led"></span><b id="conn">连接中</b></div></div>
</div></header>
<div class="shell">
  <div class="toolbar">
    <div class="toolbar-left"><button class="btn primary" id="refreshBtn">↻ 刷新</button><button class="btn" data-hours="24">24H</button><button class="btn" data-hours="12">12H</button><button class="btn" data-hours="6">6H</button><button class="btn" id="autoBtn">自动 20s</button></div>
    <div class="toolbar-right"><span class="hint" id="freshness">数据延迟：--</span><span class="hint" id="lastUpdate">最后更新：--</span></div>
  </div>
  <div class="layout"><main id="main"></main><aside class="side" id="side"></aside></div>
  <div class="footer"><div class="footerline"><span>Pipeline: <strong>Binance Entity → 链上 Outflow → Webhook → SQLite → JSON/SSE → Radar</strong></span><span>大额流出 ≠ 直接看涨</span></div></div>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><div class="title" id="modalTitle">事件详情</div><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);
let SNAP={},charts={},page='overview',hours=24,sortKey='ts',sortDir='desc',autoOn=true,timer=null,snapStatus='--';
const MODS=[['overview','总览'],['flow','Binance 流出'],['anomaly','异常币种'],['events','资金事件'],['details','异常明细']];
const LBL={'Unknown Wallet':'未识别钱包','Binance internal':'币安内部','Binance':'币安','Bybit wallet':'Bybit 钱包','Binance Hot Wallet':'币安热钱包'};
const tr=s=>LBL[s]||s;
const STABLE=new Set(['USDT','USDC','FDUSD','USDE','DAI','TUSD','USDD','PYUSD','USDP','BUSD']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=x=>{x=Number(x||0);if(!x)return'—';const a=Math.abs(x),p=x<0?'-':'';return p+(a>=1e9?'$'+(a/1e9).toFixed(2)+'B':a>=1e6?'$'+(a/1e6).toFixed(2)+'M':a>=1e3?'$'+(a/1e3).toFixed(1)+'K':'$'+a.toFixed(0))};
const num=x=>{x=Number(x||0);return x>=1e9?(x/1e9).toFixed(2)+'B':x>=1e6?(x/1e6).toFixed(2)+'M':x>=1e3?(x/1e3).toFixed(1)+'K':x.toFixed(2)};
const pct=x=>{x=Number(x||0);return (x>=0?'+':'')+x.toFixed(2)+'%'};
const absTs=x=>{if(!x)return'--';const d=new Date(Number(x));if(isNaN(d))return'--';return new Date(d.getTime()+8*3600e3).toISOString().replace('T',' ').slice(0,19)+' 北京'};
const bjShort=x=>{if(!x)return'--';const d=new Date(Number(x));if(isNaN(d))return'--';return new Date(d.getTime()+8*3600e3).toISOString().replace('T',' ').slice(5,16)};
const age=x=>{let s=Math.max(0,Math.round((Date.now()-Number(x||0))/1000));return s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const sev=sc=>Number(sc||0)>=8?'high':Number(sc||0)>=6?'medium':'info';
function p(title,body,right=''){return `<section class="panel section"><div class="head"><div class="title">${title}</div><div class="sub">${right}</div></div>${body}</section>`}
function kpi(label,value,meta,cls){return `<div class="card kpi ${cls||''}"><div class="label">${label}</div><div class="big mono">${value}</div><div class="meta">${meta||''}</div></div>`}
function tag(v,kind='info'){return `<span class="pill ${kind}">${esc(v)}</span>`}
function destType(e){const t=(e.to_label||'').toLowerCase();if(/binance/.test(t))return'内部调仓';if(/okx|bybit|gate|coinbase|kraken|kucoin|bitget|upbit|mexc/.test(t))return'交易所';if(/aave|uniswap|pancake|curve|wormhole|bridge|lido|staking|jupiter|raydium/.test(t))return'DeFi';if(/wintermute|jump|cumberland|flow traders|gsr/.test(t))return'做市商';if(!t||t.includes('unknown'))return'未识别';return e.to_label||'未识别'}
function destKind(e){const d=destType(e);return d==='未识别'?'high':d==='内部调仓'?'ops':d==='交易所'?'info':d==='DeFi'?'medium':'info'}
function fmtScore(x){const s=Number(x||0);return `<span class="score ${sev(s)} mono">${s?s.toFixed(1):'—'}</span>`}
function shortAddr(s){s=String(s||'');return s.length>16?s.slice(0,7)+'…'+s.slice(-6):s||'—'}
function eventRow(e,i){const st=destType(e),sc=Number(e.score||0);return `<tr class="click" data-row="${esc(e.id||i)}"><td>${absTs(e.ts)}</td><td><b>${esc(e.symbol||'—')}</b></td><td class="mono">${num(e.amount)}</td><td class="mono">${usd(e.usd)}</td><td>${esc(e.chain||'—')}</td><td>${esc(tr(e.from_label||'Binance'))}</td><td>${esc(tr(e.to_label||'未识别'))}</td><td>${tag(st,destKind(e))}</td><td>${fmtScore(sc)}</td><td><a class="link" href="${esc(e.explorer_url||e.url||'#')}" target="_blank" rel="noreferrer">↗</a></td></tr><tr class="details" data-detail="${esc(e.id||i)}"><td colspan="10"><div class="detailgrid"><div class="detailbox"><div class="label">来源地址</div><div class="v mono">${esc(e.from_address||'—')}</div></div><div class="detailbox"><div class="label">接收地址</div><div class="v mono">${esc(e.to_address||'—')}</div></div><div class="detailbox"><div class="label">事件分类</div><div class="v">${esc(e.category||'链上转账')}</div></div><div class="detailbox"><div class="label">时间</div><div class="v mono">${absTs(e.ts)}</div></div></div></td></tr>`}
function eventCard(e){return `<div class="event click" data-event="${esc(e.id||'')}"><div class="etime mono">${age(e.ts)}</div><div><div class="headline">${esc(e.symbol||'未知')} · ${usd(e.usd)} · ${esc(destType(e))}</div><div class="desc">${esc(tr(e.from_label||'Binance'))} → ${esc(tr(e.to_label||'未识别'))} · ${esc(e.chain||'')} · ${bjShort(e.ts)}</div></div>${fmtScore(e.score)}</div>`}
function buildMetrics(){let es=SNAP.events||[],cut=Date.now()-86400000,out=0,inn=0,unknown=0,cex=0,defi=0,max=0,count=0,high=0;const nonStable={},stable={};for(const e of es){if(Number(e.ts||0)<cut)continue;count++;const u=Number(e.usd||0);if(e.direction==='out'){out+=u;max=Math.max(max,u);let sy=(e.symbol||'未知').toUpperCase();if(STABLE.has(sy))(stable[sy]=(stable[sy]||0)+u);else(nonStable[sy]=(nonStable[sy]||0)+u);let d=destType(e);if(d==='未识别')unknown+=u;else if(d==='交易所')cex+=u;else if(d==='DeFi')defi+=u;if(Number(e.score||0)>=8)high++}else if(e.direction==='in')inn+=u}return{out,inn,net:out-inn,unknown,cex,defi,max,count,high,asset:nonStable,stable}}
function anomalyRows(){const m=buildMetrics();return Object.entries(m.asset).map(([symbol,out])=>{const ev=(SNAP.events||[]).filter(e=>e.direction==='out'&&String(e.symbol||'').toUpperCase()===symbol&&Date.now()-Number(e.ts||0)<86400000);const repeats=ev.length;const max=Math.max(...ev.map(e=>Number(e.usd||0)),0);const unknown=ev.filter(e=>destType(e)==='未识别').reduce((a,e)=>a+Number(e.usd||0),0);const score=Math.min(10,2.2+Math.log10(Math.max(out,1))*1.2+Math.min(2,repeats*.25)+(unknown/out)*1.5);return{symbol,out,repeats,max,unknown,score}}).sort((a,b)=>b.score-a.score)}
function nav(){document.getElementById('nav').innerHTML=MODS.map(([id,n])=>`<button class="${page===id?'active':''}" data-page="${id}">${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;render()})}
function overview(){const m=buildMetrics(),ranks=Object.entries(m.asset).sort((a,b)=>b[1]-a[1]).slice(0,8),an=anomalyRows().slice(0,6);return `<div class="grid5 section">${kpi('24H 资产流出',usd(Object.values(m.asset).reduce((a,b)=>a+b,0)),'已剔除稳定币后','flow')}${kpi('24H 净流出',usd(m.net),'流出 − 流入','net')}${kpi('未识别流出',usd(m.unknown),'接收方未识别','unknown')}${kpi('高危告警',m.high,'异常分 ≥ 8','hot')}${kpi('最大单笔',usd(m.max),'最大单笔流出','events')}</div>
<div class="grid4 section"><div class="card"><div class="label">24H 事件</div><div class="big mono">${m.count}</div><div class="meta">已接收事件</div></div><div class="card"><div class="label">交易所转账</div><div class="big mono">${usd(m.cex)}</div><div class="meta">自动降权</div></div><div class="card"><div class="label">DeFi / 质押</div><div class="big mono">${usd(m.defi)}</div><div class="meta">单独分类</div></div><div class="card"><div class="label">数据新鲜度</div><div class="big mono" id="freshKpi">--</div><div class="meta">基于最新事件</div></div></div>
<div class="twocol section"><div>${p('Binance 资金流','<div class="chart"><canvas id="flowChart"></canvas></div>','24H 流出 / 净额')}</div><div>${p('异常币种雷达','<div class="radar"><canvas id="radarChart"></canvas></div><div class="radarLegend"><span class="dotlg"><i style="background:#ff6475"></i>高异常</span><span class="dotlg"><i style="background:#f4c15f"></i>中异常</span><span class="dotlg"><i style="background:#63a7ff"></i>低异常</span></div>','金额 × 异常程度')}</div></div>
<div class="grid2 section"><div>${p('24H 资产流出榜',`<div class="rank">${ranks.map(([s,v],i)=>`<div class="rankrow"><span class="muted mono">${String(i+1).padStart(2,'0')}</span><span class="sym">${esc(s)}</span><div class="bar2"><i style="width:${Math.max(4,(v/(ranks[0]?.[1]||1))*100)}%"></i></div><span class="amt mono">${usd(v)}</span></div>`).join('')||'<div class="empty">暂无资产流出</div>'}</div>`,'排除稳定币')}${p('Top 异常币种',`<div class="anomalygrid">${an.map(x=>`<div class="anomaly"><div class="sym">${esc(x.symbol)} ${tag(x.score.toFixed(1),x.score>=8?'high':x.score>=6?'medium':'info')}</div><div class="valueRow"><span class="mini">24H</span><b class="mono">${usd(x.out)}</b></div><div class="valueRow"><span class="mini">连续事件</span><b class="mono">${x.repeats}</b></div><div class="meta">Unknown ${usd(x.unknown)}</div></div>`).join('')||'<div class="empty">暂无异常</div>'}</div>`,'异常倍数优先')}</div><div>${p('近 7 日流出榜',`<div class="rank">${(SNAP.top7d||[]).map((x,i)=>`<div class="rankrow"><span class="muted mono">${String(i+1).padStart(2,'0')}</span><span class="sym">${esc(x.symbol)}</span><div class="bar2"><i style="width:${Math.max(4,(x.usd/((SNAP.top7d[0]||{}).usd||1))*100)}%"></i></div><span class="amt mono">${usd(x.usd)}</span></div>`).join('')||'<div class="empty">暂无数据</div>'}</div>`,'北京时间 · 近 7 日 · 排除稳定币')}</div></div>
<div class="grid2 section"><div>${p('告警时间线',`<div class="toolbar"><select id="sevFilter" class="select"><option value="">全部级别</option><option value="high">高危</option><option value="medium">中等</option><option value="info">提示</option></select><input id="symFilter" class="input" placeholder="币种"></div><div id="timeline" class="timeline"></div>`,'最新优先')}</div><div>${p('稳定币流出',`<div class="rank">${Object.entries(m.stable).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([s,v])=>`<div class="rankrow"><span class="muted">●</span><span class="sym">${esc(s)}</span><div class="bar2 red"><i style="width:${Math.max(4,(v/(Math.max(...Object.values(m.stable),1)))*100)}%"></i></div><span class="amt mono">${usd(v)}</span></div>`).join('')||'<div class="empty">暂无稳定币流出</div>'}</div><div class="notice" style="margin-top:8px">稳定币默认不参与“异常币种”排名，避免 USDT/USDC 的大额运营调仓淹没真正的资产异动。</div>`,'USDT / USDC 单独统计')}</div></div>`}
function flowPage(){return `${p('Binance 流出 / 流入',`<div class="grid3"><div class="card"><div class="label">资产流出</div><div class="big mono">${usd(buildMetrics().out)}</div><div class="meta">24H 总流出</div></div><div class="card"><div class="label">流入</div><div class="big mono">${usd(buildMetrics().inn)}</div><div class="meta">24H 总流入</div></div><div class="card"><div class="label">净流出</div><div class="big mono">${usd(buildMetrics().net)}</div><div class="meta">净流出 = 流出 − 流入</div></div></div><div class="chart" style="margin-top:10px"><canvas id="flowChart"></canvas></div>`,'流出 / 净额')}${p('流出结构',`<div class="grid3"><div class="card"><div class="label">未识别</div><div class="big mono">${usd(buildMetrics().unknown)}</div><div class="meta">高关注</div></div><div class="card"><div class="label">交易所</div><div class="big mono">${usd(buildMetrics().cex)}</div><div class="meta">自动降权</div></div><div class="card"><div class="label">DeFi 质押</div><div class="big mono">${usd(buildMetrics().defi)}</div><div class="meta">单独观察</div></div></div>`,'去向分类')}`}
function anomalyPage(){const rows=anomalyRows();return p('异常币种雷达',`<div class="notice" style="margin-bottom:10px">这里不是“谁提得最多”，而是“谁的流出相对异常”。异常分综合 24H 流出金额、连续事件数量和 Unknown 去向占比；它是排序工具，不是方向判断。</div><div class="tablewrap"><table class="table"><thead><tr><th>币种</th><th>24H流出</th><th>事件数</th><th>最大单笔</th><th>未识别</th><th>异常分</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-symbol="${esc(r.symbol)}"><td><b>${esc(r.symbol)}</b></td><td class="mono">${usd(r.out)}</td><td class="mono">${r.repeats}</td><td class="mono">${usd(r.max)}</td><td class="mono">${usd(r.unknown)}</td><td>${fmtScore(r.score)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">暂无资产异常</div></td></tr>'}</tbody></table></div>`,'异常优先')+'</section>'}
function eventsPage(){let rows=(SNAP.events||[]).filter(e=>e.direction==='out');const q=(document.getElementById('globalSearch')?.value||'').trim().toUpperCase();if(q)rows=rows.filter(e=>`${e.symbol||''} ${e.from_label||''} ${e.to_label||''} ${e.from_address||''} ${e.to_address||''}`.toUpperCase().includes(q));rows.sort((a,b)=>sortDir*(Number(a[sortKey]||0)-Number(b[sortKey]||0)));return p('实时资金事件',`<div class="toolbar"><select id="evSym" class="select"><option value="">全部币种</option>${[...new Set(rows.map(e=>e.symbol).filter(Boolean))].sort().slice(0,80).map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="evNet" class="select"><option value="">全部网络</option>${[...new Set(rows.map(e=>e.chain).filter(Boolean))].sort().map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="evDest" class="select"><option value="">全部去向</option><option>未识别</option><option>交易所</option><option>DeFi</option><option>做市商</option><option>内部调仓</option></select><select id="evMin" class="select"><option value="1000000">≥ $1M</option><option value="5000000">≥ $5M</option><option value="10000000">≥ $10M</option><option value="50000000">≥ $50M</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th class="sort" data-sort="ts">时间</th><th>币种</th><th>数量</th><th class="sort" data-sort="usd">金额 (USD)</th><th>网络</th><th>来源</th><th>接收方</th><th>去向</th><th>异常分</th><th>交易</th></tr></thead><tbody id="eventBody">${rows.slice(0,300).map(eventRow).join('')||'<tr><td colspan="10"><div class="empty">等待链上事件…</div></td></tr>'}</tbody></table></div>`,'点击行展开详情')+'</section>'}
function detailsPage(){const rows=(SNAP.events||[]).filter(e=>e.direction==='out');return p('异常事件明细',`<div class="grid4" style="margin-bottom:10px"><div class="card"><div class="label">高危</div><div class="big mono">${rows.filter(e=>Number(e.score||0)>=8).length}</div></div><div class="card"><div class="label">未识别</div><div class="big mono">${rows.filter(e=>destType(e)==='未识别').length}</div></div><div class="card"><div class="label">交易所</div><div class="big mono">${rows.filter(e=>destType(e)==='交易所').length}</div></div><div class="card"><div class="label">做市商</div><div class="big mono">${rows.filter(e=>destType(e)==='做市商').length}</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>时间</th><th>币种</th><th>方向</th><th>金额</th><th>异常分</th><th>来源地址</th><th>接收地址</th><th>去向</th><th>详情</th></tr></thead><tbody>${rows.slice(0,200).map((e,i)=>`<tr class="click" data-row="${esc(e.id||i)}"><td>${absTs(e.ts)}</td><td><b>${esc(e.symbol||'—')}</b></td><td>${tag('流出','high')}</td><td class="mono">${usd(e.usd)}</td><td>${fmtScore(e.score)}</td><td class="mono"><span class="addr" title="${esc(e.from_address||'')}">${esc(shortAddr(e.from_address))}</span></td><td class="mono"><span class="addr" title="${esc(e.to_address||'')}">${esc(shortAddr(e.to_address))}</span></td><td>${tag(destType(e),destKind(e))}</td><td><a class="link" href="${esc(e.explorer_url||e.url||'#')}" target="_blank">Etherscan ↗</a></td></tr><tr class="details"><td colspan="9"><div class="detailgrid"><div class="detailbox"><div class="label">来源</div><div class="v mono">${esc(e.from_address||'—')}</div></div><div class="detailbox"><div class="label">接收</div><div class="v mono">${esc(e.to_address||'—')}</div></div><div class="detailbox"><div class="label">标题</div><div class="v">${esc(e.title||'—')}</div></div><div class="detailbox"><div class="label">原始分类</div><div class="v">${esc(e.category||'链上转账')}</div></div></div></td></tr>`).join('')||'<tr><td colspan="9"><div class="empty">暂无异常事件</div></td></tr>'}</tbody></table></div>`,'长地址默认折叠')+'</section>'}
const HN={Binance:'币安',Derivatives:'衍生品',Liquidations:'清算',Options:'期权',FearGreed:'恐慌贪婪指数',ETF:'现货ETF',Macro:'宏观',OnchainWebhook:'链上接收',Telegram:'Telegram',Database:'数据库'};
function side(){const h=SNAP.health||{};const latest=(SNAP.events||[]).filter(e=>e.direction==='out').slice(0,12);return `${p('数据源状态',`<div class="health">${Object.entries(h).map(([k,v])=>`<div class="healthrow"><span>${esc(HN[k]||k)}</span><b class="${v?'up':'amber'}">${v?'在线':'未配置'}</b></div>`).join('')}</div>`,'在线 / 未配置')}${p('最新告警',`<div class="timeline">${latest.map(eventCard).join('')||'<div class="empty">等待事件…</div>'}</div>`,'北京时间')}${p('监控规则',`<div class="notice">单笔默认关注 ≥ $1M。高危：异常分 ≥ 8。稳定币独立统计。交易所 / 内部调仓自动降权，未识别钱包提高关注度。</div>`,'规则引擎')}${p('同步方式',`<div class="notice">静态快照站：本页每 60s 拉取 <b class="mono">data/radar_events.json</b>，该 JSON 由服务端每 2 分钟导出（币安实体 → 链上流出 → Webhook → SQLite → 导出）。Telegram 推送在服务端完成，本页不直连。</div>`,'静态')}`}
function render(){nav();document.getElementById('main').innerHTML=page==='overview'?overview():page==='flow'?flowPage():page==='anomaly'?anomalyPage():page==='events'?eventsPage():detailsPage();document.getElementById('side').innerHTML=side();bind();}
function bind(){document.querySelectorAll('.click[data-row]').forEach(row=>row.onclick=e=>{if(e.target.closest('a'))return;const id=row.dataset.row;const d=document.querySelector(`tr.details[data-detail="${CSS.escape(id)}"]`)||row.nextElementSibling;if(d)d.classList.toggle('open')});document.querySelectorAll('.event.click[data-event]').forEach(x=>x.onclick=()=>openEvent(x.dataset.event));document.querySelectorAll('[data-sort]').forEach(x=>x.onclick=()=>{sortKey=x.dataset.sort;sortDir=sortDir*-1;render()});document.querySelectorAll('[data-symbol]').forEach(x=>x.onclick=()=>{document.getElementById('globalSearch').value=x.dataset.symbol;page='events';render()});document.getElementById('refreshBtn')?.addEventListener('click',load);document.getElementById('sevFilter')?.addEventListener('change',filterTimeline);document.getElementById('symFilter')?.addEventListener('input',filterTimeline);document.getElementById('evSym')?.addEventListener('change',applyEventFilters);document.getElementById('evNet')?.addEventListener('change',applyEventFilters);document.getElementById('evDest')?.addEventListener('change',applyEventFilters);document.getElementById('evMin')?.addEventListener('change',applyEventFilters);if(page==='overview'||page==='flow')setTimeout(renderFlow,0);if(page==='overview')setTimeout(renderRadar,0);document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{hours=Number(b.dataset.hours);render()});}
function filterTimeline(){const s=document.getElementById('sevFilter')?.value||'',q=(document.getElementById('symFilter')?.value||'').trim().toUpperCase();let rows=(SNAP.events||[]).filter(e=>e.direction==='out');rows=rows.filter(e=>(!s||sev(e.score)===s)&&(!q||String(e.symbol||'').toUpperCase().includes(q)));document.getElementById('timeline').innerHTML=rows.slice(0,100).map(eventCard).join('')||'<div class="empty">暂无匹配事件</div>'}
function applyEventFilters(){let rows=(SNAP.events||[]).filter(e=>e.direction==='out');const s=document.getElementById('evSym')?.value||'',n=document.getElementById('evNet')?.value||'',d=document.getElementById('evDest')?.value||'',mn=Number(document.getElementById('evMin')?.value||0);rows=rows.filter(e=>(!s||e.symbol===s)&&(!n||e.chain===n)&&(!d||destType(e)===d)&&Number(e.usd||0)>=mn);rows.sort((a,b)=>sortDir*(Number(a[sortKey]||0)-Number(b[sortKey]||0)));document.getElementById('eventBody').innerHTML=rows.slice(0,300).map(eventRow).join('')||'<tr><td colspan="10"><div class="empty">暂无匹配事件</div></td></tr>';bind()}
function setConn(ok){document.getElementById('led').className='led '+(ok?'live':'warn');document.getElementById('conn').textContent=ok?'快照':'离线'}
function updateFreshness(){const ev=(SNAP.events||[]).slice(0,1)[0];let a=ev?Math.max(0,Math.round((Date.now()-Number(ev.ts))/1000)):null;const st=a==null?'--':(a<60?Math.round(a)+'s':Math.floor(a/60)+'m');document.getElementById('freshness').textContent='数据延迟：'+st;document.getElementById('lastUpdate').textContent='最后更新：'+(SNAP.updated?absTs(SNAP.updated):'--');const fk=document.getElementById('freshKpi');if(fk)fk.textContent=st}
async function load(){try{const r=await fetch('data/radar_events.json?z='+Date.now(),{cache:'no-store'});SNAP=await r.json();setConn(true);updateFreshness();render()}catch(e){setConn(false)}}
function schedule(){clearInterval(timer);if(autoOn)timer=setInterval(load,60000)}
function renderFlow(){const c=document.getElementById('flowChart');if(!c)return;const H=Math.max(1,Math.min(72,Number(hours)||24));const fs=(SNAP.flowSeries||[]).slice(-H);if(!fs.length){if(charts.flow)charts.flow.destroy();return}if(charts.flow)charts.flow.destroy();charts.flow=new Chart(c,{type:'line',data:{labels:fs.map(x=>x.label),datasets:[{label:'流出',data:fs.map(x=>x.outflow),borderColor:'#63a7ff',backgroundColor:'rgba(99,167,255,.10)',fill:true,tension:.25,pointRadius:0},{label:'流入',data:fs.map(x=>x.inflow),borderColor:'#33d391',backgroundColor:'rgba(51,211,145,.06)',fill:true,tension:.25,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#9db0c4'}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+usd(c.raw)}}},scales:{x:{ticks:{color:'#73879c',maxTicksLimit:12},grid:{color:'#142536'}},y:{ticks:{color:'#73879c',callback:v=>usd(v)},grid:{color:'#142536'}}}}})}
function renderRadar(){const c=document.getElementById('radarChart');if(!c)return;const rows=anomalyRows().slice(0,20);if(!rows.length){if(charts.radar)charts.radar.destroy();return}if(charts.radar)charts.radar.destroy();const maxOut=Math.max(...rows.map(x=>x.out),1);charts.radar=new Chart(c,{type:'scatter',data:{datasets:[{label:'异常币种',data:rows.map(x=>({x:x.out,y:x.score,label:x.symbol,r:x.repeats})),backgroundColor:rows.map(x=>x.score>=8?'#ff6475':x.score>=6?'#f4c15f':'#63a7ff'),pointRadius:rows.map(x=>Math.min(10,4+x.repeats)),pointHoverRadius:10}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw.label} · 流出 ${usd(c.raw.x)} · Score ${c.raw.y.toFixed(1)} · 事件 ${c.raw.r}`}}},scales:{x:{type:'logarithmic',min:Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(1,Math.min(...rows.map(x=>x.out),maxOut))))-1)),ticks:{color:'#73879c',callback:v=>usd(v)},grid:{color:'#142536'},title:{display:true,text:'24H 流出',color:'#7f92a8'}},y:{min:0,max:10,ticks:{color:'#73879c'},grid:{color:'#142536'},title:{display:true,text:'异常分',color:'#7f92a8'}}}}})}
function openEvent(id){const e=(SNAP.events||[]).find(x=>String(x.id)===String(id));if(!e)return;document.getElementById('modalTitle').textContent=`${e.symbol||'未知'} · ${usd(e.usd)} · ${destType(e)}`;const mk=SNAP.market?.[String(e.symbol||'').toUpperCase()+'USDT']||SNAP.market?.[String(e.symbol||'').toUpperCase()]||{};const der=SNAP.derivatives?.[String(e.symbol||'').toUpperCase()+'USDT']||{};document.getElementById('modalBody').innerHTML=`<div class="contextGrid"><div class="contextCard"><div class="label">24H 价格</div><div class="v mono">${mk.price?mk.price.toString():'—'}</div><div class="meta">${mk.change24!=null?pct(mk.change24):''}</div></div><div class="contextCard"><div class="label">持仓量 OI</div><div class="v mono">${der.oi?num(der.oi):'—'}</div><div class="meta">${der.oi?'币安合约':'未覆盖'}</div></div><div class="contextCard"><div class="label">资金费率</div><div class="v mono">${der.funding!=null?(der.funding*100).toFixed(4)+'%':'—'}</div><div class="meta">当前</div></div><div class="contextCard"><div class="label">异常分</div><div class="v">${fmtScore(e.score)}</div><div class="meta">${esc(e.category||'链上转账')}</div></div></div><div style="height:10px"></div><div class="grid2"><div class="detailbox"><div class="label">来源</div><div class="v mono">${esc(tr(e.from_label||'Binance'))}<br>${esc(e.from_address||'—')}</div></div><div class="detailbox"><div class="label">接收方</div><div class="v">${esc(tr(e.to_label||'未识别'))}<br><span class="mono">${esc(e.to_address||'—')}</span></div></div></div><div style="height:10px"></div><div class="notice">判读提示：${destType(e)==='未识别'?'接收方未识别，进入高关注池，但不等于买盘。':destType(e)==='交易所'?'转入其他交易所，默认降低结构性流出评分。':destType(e)==='做市商'?'已识别为做市/流动性相关钱包，单独观察。':'该流向需要结合价格、OI、Funding 和后续钱包行为确认。'}</div><div style="height:10px"></div><a class="link" href="${esc(e.explorer_url||e.url||'#')}" target="_blank">查看链上交易 ↗</a>`;document.getElementById('modal').classList.add('show')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}
document.getElementById('globalSearch').addEventListener('input',()=>{if(page==='events')render()});document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('show')};document.getElementById('refreshBtn').onclick=load;document.getElementById('autoBtn').onclick=()=>{autoOn=!autoOn;document.getElementById('autoBtn').textContent=autoOn?'自动 60s':'自动 OFF';schedule()};document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{hours=Number(b.dataset.hours);render()});
document.getElementById('autoBtn').textContent='自动 60s';
(async function(){await load();schedule()})();
</script>
</body></html>
