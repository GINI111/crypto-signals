<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENA TREND RADAR · 趋势雷达</title>
<style>
:root{--bg:#08111a;--panel:#0d1a26;--panel2:#101f2e;--line:#1a2f42;--txt:#c8e6dc;--dim:rgba(200,230,220,.45);--green:#00c896;--red:#ff4466;--yellow:#f5c518;--cyan:#00aaff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'PingFang SC','Microsoft YaHei',monospace;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px;letter-spacing:1px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--cyan)}
button.on{background:var(--cyan);color:#04121a;font-weight:bold}
#status{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel2);color:var(--dim);padding:8px 6px;text-align:left;font-weight:normal;position:sticky;top:0}
td{padding:7px 6px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(0,200,150,.04)}
.sym{font-weight:bold}
.sym a{color:var(--cyan);text-decoration:none}
.score{font-weight:bold;font-size:14px}
.s{color:var(--green)}.a{color:var(--yellow)}.n{color:var(--dim)}
.up{color:var(--green)}.down{color:var(--red)}
#detail{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
#detail h2{font-size:16px;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--panel2);border-radius:6px;padding:10px}
.metric .k{color:var(--dim);font-size:12px}
.metric .v{font-size:15px;font-weight:bold;margin-top:4px}
.metric .s{font-size:12px;color:var(--dim)}
.entry{margin-top:12px;background:var(--panel2);border-radius:6px;padding:12px}
.entry .row{display:flex;gap:16px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.tag.s{background:rgba(0,200,150,.15);color:var(--green)}
.tag.a{background:rgba(245,197,24,.12);color:var(--yellow)}
.tag.n{background:rgba(200,230,220,.08);color:var(--dim)}
.ok{color:var(--green)}.wait{color:var(--yellow)}.no{color:var(--red)}
#chartBox{width:100%;height:260px;margin-top:12px}
@media(max-width:700px){.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>🔥 ENA TREND RADAR <span style="font-size:13px;color:var(--dim)">趋势质量雷达</span></h1>
<div class="sub">ENA Score 0~12：距MA7 + MA7 20根涨幅 + MA7单调性 + 末5根斜率 + 峰值回撤 · 1H 趋势质量</div>
<div class="bar">
  <button id="btnScan" onclick="scanAll()">🔄 扫描全市场</button>
  <span id="status">就绪</span>
</div>
<table id="tbl">
<thead><tr>
  <th>#</th><th>币种</th><th>ENA分</th><th>等级</th><th>距MA7</th><th>20根涨幅</th><th>单调性</th><th>末5斜率</th><th>峰值回撤</th><th>24h</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="detail"></div>
<script>
const $=id=>document.getElementById(id);
let RADAR_DATA=[];

// ── ENA 打分（与 ena_score.js 一致）──
function scoreDistMA7(price,ma7){const dist=(price-ma7)/ma7*100;let s;if(price<ma7)s=0;else if(dist<=1)s=1;else if(dist<=4)s=3;else if(dist<=6)s=2;else if(dist<=8)s=1;else s=0;return{s,dist}}
function scoreMA7Gain(ma7){const n=ma7.length,start=ma7[n-21],end=ma7[n-1],gain=(end-start)/start*100;let s;if(gain<5)s=0;else if(gain<10)s=1;else if(gain<20)s=2;else if(gain<=35)s=3;else s=2;return{s,gain}}
function scoreMonotonic(ma7){const n=ma7.length,seg=ma7.slice(n-21);let up=0;for(let i=1;i<seg.length;i++)if(seg[i]>seg[i-1])up++;const ratio=up/(seg.length-1)*100;let s;if(ratio>=95)s=2;else if(ratio>=85)s=1.5;else if(ratio>=75)s=1;else s=0;return{s,ratio}}
function scoreSlope5(ma7){const n=ma7.length,start=ma7[n-6],end=ma7[n-1],slope=(end-start)/start*100;let s;if(slope<=2)s=1;else if(slope<=6)s=2;else if(slope<=9)s=1.5;else if(slope<=12)s=1;else s=0;return{s,slope}}
function scoreDrawdown(closes){const n=closes.length,seg=closes.slice(n-20),peak=Math.max(...seg),cur=seg[seg.length-1],dd=(peak-cur)/peak*100;let s;if(dd<=1)s=2;else if(dd<=3)s=1;else if(dd<=5)s=0.5;else s=0;return{s,dd}}
function calcENA(closes){
  if(!closes||closes.length<30)return null;
  const ma7=[];for(let i=6;i<closes.length;i++){let s=0;for(let j=i-6;j<=i;j++)s+=closes[j];ma7.push(s/7)}
  const price=closes[closes.length-1],curMA7=ma7[ma7.length-1];
  const d1=scoreDistMA7(price,curMA7),d2=scoreMA7Gain(ma7),d3=scoreMonotonic(ma7),d4=scoreSlope5(ma7),d5=scoreDrawdown(closes);
  const total=d1.s+d2.s+d3.s+d4.s+d5.s;
  let level='⚪️ 普通';if(total>=10.5)level='🔥 S级趋势';else if(total>=8.5)level='🟡 A级趋势';
  return{total,level,parts:{d1,d2,d3,d4,d5}};
}

// ── 数据获取 ──
async function getKlines(sym,interval,limit){
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${interval}&limit=${limit}`);
  const j=await r.json();
  return j.map(k=>({t:Math.floor(k[0]/1000),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
}

// ── 全市场扫描 ──
async function scanAll(){
  $('btnScan').disabled=true;
  $('status').textContent='获取市场列表...';
  try{
    const tickers=await fetch('https://api.binance.com/api/v3/ticker/24hr').then(r=>r.json());
    const skip=s=>/UP|DOWN|BULL|BEAR|USD1|FDUSD|USDC|TUSD|EUR|BUSD|DAI|PAXG|AEUR|BRL|TRY|ZAR|UAH|IDRT|NGN|RUB|USDP|XUSD|USTC|USDD|SUSHI.*USD/.test(s);
    let coins=tickers.filter(x=>x.symbol.endsWith('USDT')&&!skip(x.symbol))
      .sort((a,b)=>+b.quoteVolume-+a.quoteVolume)
      .slice(0,40).map(x=>x.symbol.replace('USDT',''));
    $('status').textContent=`扫描 ${coins.length} 个币种 (1H)...`;
    RADAR_DATA=[];
    const results=[];
    // 并发 6
    for(let i=0;i<coins.length;i+=6){
      const batch=coins.slice(i,i+6);
      await Promise.all(batch.map(async c=>{
        try{
          const kl=await getKlines(c,'1h',40);
          const r=calcENA(kl.map(x=>x.c));
          if(!r)return;
          const t=tickers.find(x=>x.symbol===c+'USDT');
          results.push({sym:c,ena:r,total:r.total,level:r.level,chg:t?+t.priceChangePercent:0,
            dist:r.parts.d1.dist,gain:r.parts.d2.gain,mono:r.parts.d3.ratio,slope:r.parts.d4.slope,dd:r.parts.d5.dd,
            closes:kl.map(x=>x.c),times:kl.map(x=>x.t)});
        }catch(e){}
      }));
      $('status').textContent=`扫描中... ${Math.min(i+6,coins.length)}/${coins.length}`;
    }
    results.sort((a,b)=>b.total-a.total);
    RADAR_DATA=results;
    renderTable(results);
    $('status').textContent=`✅ ${results.length} 个币种 · ${new Date().toLocaleTimeString()} · 点击行看详情`;
  }catch(e){$('status').textContent='❌ 扫描失败: '+e.message}
  $('btnScan').disabled=false;
}

function renderTable(rows){
  const tb=$('tbody');tb.innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.style.cursor='pointer';
    tr.onclick=()=>showDetail(r);
    const cls=r.total>=10.5?'s':(r.total>=8.5?'a':'n');
    const chgCls=r.chg>=0?'up':'down';
    tr.innerHTML=`<td>${i+1}</td>
      <td class="sym"><a href="https://www.binance.com/zh-CN/trade/${r.sym}_USDT" target="_blank">${r.sym}</a></td>
      <td class="score ${cls}">${r.total.toFixed(1)}</td>
      <td><span class="tag ${cls}">${r.level}</span></td>
      <td class="${r.dist>4?'down':(r.dist>=0?'up':'down')}">${r.dist>=0?'+':''}${r.dist.toFixed(1)}%</td>
      <td class="${r.gain>=10?'up':'n'}">${r.gain>=0?'+':''}${r.gain.toFixed(1)}%</td>
      <td class="${r.mono>=95?'up':'n'}">${r.mono.toFixed(0)}%</td>
      <td class="${r.slope>6?'down':(r.slope>=2?'up':'n')}">${r.slope>=0?'+':''}${r.slope.toFixed(1)}%</td>
      <td class="${r.dd>3?'down':'up'}">-${r.dd.toFixed(1)}%</td>
      <td class="${chgCls}">${r.chg>=0?'+':''}${r.chg.toFixed(1)}%</td>`;
    tb.appendChild(tr);
  });
}

// 指标解读备注
function noteDist(d){
  if(d<0)return '⚠️ 价格跌破MA7，趋势暂弱';
  if(d<=1)return '📌 刚站上均线，早期';
  if(d<=4)return '✅ 最佳区间，贴线健康上涨';
  if(d<=6)return '🟡 偏离加大，注意回踩';
  if(d<=8)return '⚠️ 偏离较多，追高风险';
  return '🚨 严重偏离，警惕均值回归';
}
function noteGain(g){
  if(g<5)return '📉 涨幅不足，趋势未成';
  if(g<10)return '📌 趋势启动初期';
  if(g<20)return '✅ 健康趋势区间';
  if(g<=35)return '🔥 强趋势，加速段';
  return '⚠️ 涨幅过大，或近末端';
}
function noteMono(m){
  if(m>=95)return '✅ 均线一路向上，极强';
  if(m>=85)return '🟡 整体向上，偶有反复';
  if(m>=75)return '⚠️ 趋势不连贯';
  return '❌ 均线反复，无趋势';
}
function noteSlope(s){
  if(s<=2)return '📌 斜率平缓，蓄势中';
  if(s<=6)return '✅ 稳定加速中';
  if(s<=9)return '🟡 加速偏快';
  if(s<=12)return '⚠️ 快速拉升，防回落';
  return '🚨 陡峭拉升，风险高';
}
function noteDD(d){
  if(d<=1)return '✅ 无回撤，走势干净';
  if(d<=3)return '🟡 小幅回撤，正常';
  if(d<=5)return '⚠️ 回撤加深，关注';
  return '❌ 深回撤，趋势受损';
}

// ── 详情 ──
let detailChart=null;
async function showDetail(r){
  const d=$('detail');d.style.display='block';
  const p=r.ena.parts;
  const cls=r.total>=10.5?'s':(r.total>=8.5?'a':'n');
  d.innerHTML=`<h2>${r.sym} <span class="tag ${cls}">${r.level}</span> <span style="font-size:13px;color:var(--dim)">ENA ${r.total.toFixed(1)}/12</span></h2>
  <div class="metrics">
    <div class="metric"><div class="k">① 距 MA7 · ${p.d1.dist>=0?'+':''}${p.d1.dist.toFixed(1)}% <span style="color:var(--dim)">(${p.d1.s}/3)</span></div><div class="v ${p.d1.dist>4?'down':(p.d1.dist>=0?'up':'down')}">${noteDist(p.d1.dist)}</div></div>
    <div class="metric"><div class="k">② MA7 20根累计涨幅 · +${p.d2.gain.toFixed(1)}% <span style="color:var(--dim)">(${p.d2.s}/3)</span></div><div class="v up">${noteGain(p.d2.gain)}</div></div>
    <div class="metric"><div class="k">③ MA7 单调性 · ${p.d3.ratio.toFixed(0)}% <span style="color:var(--dim)">(${p.d3.s}/2)</span></div><div class="v ${p.d3.ratio>=95?'up':'n'}">${noteMono(p.d3.ratio)}</div></div>
    <div class="metric"><div class="k">④ 末5根斜率 · ${p.d4.slope>=0?'+':''}${p.d4.slope.toFixed(1)}% <span style="color:var(--dim)">(${p.d4.s}/2)</span></div><div class="v ${p.d4.slope>6?'down':(p.d4.slope>=2?'up':'n')}">${noteSlope(p.d4.slope)}</div></div>
    <div class="metric"><div class="k">⑤ 峰值回撤 · -${p.d5.dd.toFixed(1)}% <span style="color:var(--dim)">(${p.d5.s}/2)</span></div><div class="v ${p.d5.dd>3?'down':'up'}">${noteDD(p.d5.dd)}</div></div>
    <div class="metric"><div class="k">24h 涨跌</div><div class="v ${r.chg>=0?'up':'down'}">${r.chg>=0?'+':''}${r.chg.toFixed(1)}%</div><div class="s">市场热度参考</div></div>
  </div>
  <div class="entry">
    <div style="font-weight:bold;color:var(--cyan)">🎯 ENA → Entry 两阶段</div>
    <div class="row"><span>1H 趋势：<b class="${cls==='s'?'ok':(cls==='a'?'wait':'no')}">${r.level}</b></span>
    <span>15m 状态：<span id="m15state" class="wait">检测中...</span></span>
    <span>入场：<span id="entryState" class="wait">等待 15m 回踩+突破</span></span></div>
  </div>
  <div id="chartBox"></div>`;
  // 15m 入场检测
  checkEntry15m(r);
  // 画 1H K线 + MA7
  drawChart(r);
}

async function checkEntry15m(r){
  try{
    const kl=await getKlines(r.sym,'15m',60);
    if(!kl||kl.length<20){$('m15state').textContent='数据不足';return}
    const closes=kl.map(x=>x.c);
    const ma7=[];for(let i=6;i<closes.length;i++){let s=0;for(let j=i-6;j<=i;j++)s+=closes[j];ma7.push(s/7)}
    const cur=closes[closes.length-1],curMA7=ma7[ma7.length-1];
    const prevHigh=Math.max(...closes.slice(-20,-1));
    const vol=kl.slice(-5).reduce((a,x)=>a+x.v,0)/5;
    const volPrev=kl.slice(-10,-5).reduce((a,x)=>a+x.v,0)/5;
    const inPullback=cur<curMA7*1.005;      // 回踩到 MA7 附近
    const brokeHigh=cur>prevHigh;            // 突破前高
    const volOk=vol>volPrev*1.2;             // 量能放大
    const st=$('m15state');
    if(brokeHigh&&volOk){st.textContent='突破+放量 ✅';st.className='ok';$('entryState').textContent='🟢 BUY 信号';$('entryState').className='ok'}
    else if(inPullback){st.textContent='回踩中';st.className='wait';$('entryState').textContent='🟡 等待突破前高';$('entryState').className='wait'}
    else if(cur>curMA7){st.textContent='MA7上方运行';st.className='ok';$('entryState').textContent='🟡 等待回踩或突破';$('entryState').className='wait'}
    else{st.textContent='跌破MA7';st.className='no';$('entryState').textContent='⚪️ 结构破坏，不追';$('entryState').className='no'}
  }catch(e){$('m15state').textContent='--'}
}

function drawChart(r){
  const box=$('chartBox');box.innerHTML='';
  if(detailChart)try{detailChart.remove()}catch(e){}
  // 简单 SVG K线（避免引外部库，保持轻量）
  const w=box.clientWidth,h=260,pad=8;
  const kl=r.closes.slice(-40).map((c,i)=>({t:r.times[i],c}));
  const min=Math.min(...r.closes.slice(-40)),max=Math.max(...r.closes.slice(-40));
  const range=max-min||1;
  const x=i=>pad+i*(w-pad*2)/(kl.length-1);
  const y=v=>h-pad-(v-min)/range*(h-pad*2);
  let svg=`<svg width="${w}" height="${h}" style="background:var(--panel2);border-radius:6px">`;
  // MA7 线
  const ma7=[];for(let i=6;i<r.closes.length;i++){let s=0;for(let j=i-6;j<=i;j++)s+=r.closes[j];ma7.push(s/7)}
  const ma7Seg=ma7.slice(-40);
  let pts='';
  for(let i=0;i<ma7Seg.length;i++)pts+=`${i===0?'':','}${x(i).toFixed(1)},${y(ma7Seg[i]).toFixed(1)}`;
  svg+=`<polyline points="${pts}" fill="none" stroke="#f5c518" stroke-width="1.5" opacity="0.9"/>`;
  // 收盘价线
  pts='';
  for(let i=0;i<kl.length;i++)pts+=`${i===0?'':','}${x(i).toFixed(1)},${y(kl[i].c).toFixed(1)}`;
  svg+=`<polyline points="${pts}" fill="none" stroke="#00c896" stroke-width="1.5"/>`;
  svg+=`</svg>`;
  box.innerHTML=svg;
}

// 自动扫描
scanAll();
// 每3分钟自动刷新（去掉 hidden 判断，保证前台必刷）
let countdown = 180;
setInterval(() => {
  countdown--;
  const st = $('status');
  // 只在非扫描时更新倒计时
  if (!st.textContent.includes('扫描中')) {
    const m = Math.floor(countdown / 60), s = countdown % 60;
    st.textContent = `⏱ 下次刷新 ${m}:${String(s).padStart(2,'0')} · ${st.textContent.replace(/^⏱[^·]*· /,'')}`;
  }
  if (countdown <= 0) { countdown = 180; scanAll(); }
}, 1000);
// 后台标签页节能修复：切回前台立即刷新（浏览器对后台标签 setInterval 会节流/暂停）
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    const st = $('status');
    const m = st.textContent.match(/(\d{1,2}:\d{2}:\d{2})/);
    if (m) {
      const parts = m[1].split(':').map(Number);
      const now = new Date();
      const last = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parts[0], parts[1], parts[2]);
      // 距上次扫描 > 60 秒 → 立即刷新
      if (now - last > 60000) { countdown = 180; scanAll(); }
    } else {
      countdown = 180; scanAll();
    }
  }
});
</script>
</body>
</html>
