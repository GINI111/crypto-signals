<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENA 趋势雷达 v2</title>
<style>
:root{--bg:#08111a;--panel:#0d1a26;--panel2:#101f2e;--line:#1a2f42;--txt:#c8e6dc;--dim:rgba(200,230,220,.45);--green:#00c896;--red:#ff4466;--yellow:#f5c518;--cyan:#00aaff;--orange:#ff9f43}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'PingFang SC','Microsoft YaHei',monospace;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px;letter-spacing:1px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--cyan)}
button.on{background:var(--cyan);color:#04121a;font-weight:bold}
#status{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel2);color:var(--dim);padding:8px 6px;text-align:left;font-weight:normal;position:sticky;top:0}
td{padding:7px 6px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(0,200,150,.04)}
.sym{font-weight:bold}
.sym a{color:var(--cyan);text-decoration:none}
.score{font-weight:bold;font-size:14px}
.s{color:var(--green)}.a{color:var(--yellow)}.n{color:var(--dim)}
.up{color:var(--green)}.down{color:var(--red)}
.qbar{display:inline-block;width:44px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);border-radius:3px}
.stg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:bold}
.stg.start{background:rgba(0,170,255,.12);color:var(--cyan)}
.stg.accel{background:rgba(0,200,150,.15);color:var(--green)}
.stg.mature{background:rgba(245,197,24,.12);color:var(--yellow)}
.stg.over{background:rgba(255,68,102,.15);color:var(--red)}
.stg.decl{background:rgba(200,230,220,.08);color:var(--dim)}
.entryTag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:bold}
.et.good{background:rgba(0,200,150,.15);color:var(--green)}
.et.wait{background:rgba(245,197,24,.12);color:var(--yellow)}
.et.early{background:rgba(0,170,255,.12);color:var(--cyan)}
.et.avoid{background:rgba(255,68,102,.12);color:var(--red)}
.delta{font-size:12px;font-weight:bold}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.new{color:var(--cyan)}
#detail{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
#detail h2{font-size:16px;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--panel2);border-radius:6px;padding:10px}
.metric .k{color:var(--dim);font-size:12px}
.metric .v{font-size:15px;font-weight:bold;margin-top:4px}
.metric .s{font-size:12px;color:var(--dim)}
.hbar{display:inline-block;width:90px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px}
.entry{margin-top:12px;background:var(--panel2);border-radius:6px;padding:12px}
.entry .row{display:flex;gap:16px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.tag.s{background:rgba(0,200,150,.15);color:var(--green)}
.tag.a{background:rgba(245,197,24,.12);color:var(--yellow)}
.tag.n{background:rgba(200,230,220,.08);color:var(--dim)}
.ok{color:var(--green)}.wait{color:var(--yellow)}.no{color:var(--red)}
.pb{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold;background:rgba(0,200,150,.15);color:var(--green)}
#chartBox{width:100%;height:260px;margin-top:12px}
.legend{color:var(--dim);font-size:11px;margin-bottom:8px}
@media(max-width:700px){.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>🔥 ENA 趋势雷达 <span style="font-size:13px;color:var(--dim)">v2 · 趋势质量+阶段+入场</span></h1>
<div class="sub">质量 0~10 趋势质量 · 阶段 趋势阶段 · 入场 0~5 入场质量 · 健康度 0~100 健康度 · 1小时 周期</div>
<div class="bar">
  <button id="btnScan" onclick="scanAll()">🔄 扫描全市场</button>
  <button id="f_all" class="on" onclick="setFilter('all')">全部</button>
  <button id="f_start" onclick="setFilter('start')">🆕 启动</button>
  <button id="f_accel" onclick="setFilter('accel')">🔥 加速</button>
  <button id="f_pb" onclick="setFilter('pb')">🔄 回踩</button>
  <button id="f_over" onclick="setFilter('over')">⚠️ 过热</button>
  <button id="f_decl" onclick="setFilter('decl')">📉 衰退</button>
  <span id="status">就绪</span>
</div>
<div class="legend">Δ = 距上次扫描 Quality 变化（浏览器本地记忆）· 点击行看详情</div>
<table id="tbl">
<thead><tr>
  <th>#</th><th>币种</th><th>Quality</th><th>阶段</th><th>入场</th><th>距MA7</th><th>20根涨幅</th><th>单调性</th><th>末5斜率</th><th>回撤</th><th>Δ</th><th>24h</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="detail"></div>
<script>
const $=id=>document.getElementById(id);
let RADAR_DATA=[], CUR_FILTER='all';
const LS_KEY='ena_radar_v2_scores';

// ═══════════ v2 评分（与 ena_score.js 一致）═══════════
function calcMA7(closes){const ma7=[];for(let i=6;i<closes.length;i++){let s=0;for(let j=i-6;j<=i;j++)s+=closes[j];ma7.push(s/7)}return ma7}
function calcIndicators(closes){
  const ma7=calcMA7(closes),n=ma7.length,price=closes[closes.length-1],curMA7=ma7[n-1];
  const dist=(price-curMA7)/curMA7*100;
  const gain=ma7[n-21]>0?(ma7[n-1]-ma7[n-21])/ma7[n-21]*100:0;
  const seg=ma7.slice(n-21);let up=0;for(let i=1;i<seg.length;i++)if(seg[i]>seg[i-1])up++;
  const mono=up/(seg.length-1)*100;
  const slope=(ma7[n-1]-ma7[n-6])/ma7[n-6]*100;
  const cseg=closes.slice(n-20),peak=Math.max(...cseg);
  const dd=(peak-cseg[cseg.length-1])/peak*100;
  return{price,ma7,dist,gain,mono,slope,dd};
}
function calcQuality(ind){
  let q=0;
  if(ind.mono>=95)q+=3;else if(ind.mono>=90)q+=2.5;else if(ind.mono>=85)q+=2;else if(ind.mono>=75)q+=1;
  if(ind.slope>=2&&ind.slope<=8)q+=3;else if(ind.slope>0&&ind.slope<2)q+=1.5;else if(ind.slope>8&&ind.slope<=12)q+=1.5;else if(ind.slope>12)q+=0.5;
  if(ind.gain>=15&&ind.gain<=25)q+=2;else if(ind.gain>=5&&ind.gain<15)q+=1.5;else if(ind.gain>25&&ind.gain<=35)q+=1;else if(ind.gain>35)q+=0.5;
  if(ind.dd<=1)q+=2;else if(ind.dd<=3)q+=1.5;else if(ind.dd<=5)q+=0.5;
  return Math.round(q*10)/10;
}
function calcStage(ind){
  if(ind.dist>6||ind.slope>12||ind.gain>35)return'OVEREXTENDED';
  if(ind.slope<0||ind.mono<60||ind.dd>5)return'DECLINING';
  if(ind.dist<=1.5&&ind.gain<12)return'STARTING';
  if(ind.dist<=4&&ind.slope>=2)return'ACCELERATION';
  if(ind.dist>4||ind.gain>=20)return'MATURE';
  return'ACCELERATION';
}
function detectPullback(closes,ma7){
  const n=closes.length;if(n<30)return false;
  let dipped=false;
  for(let i=Math.max(0,n-6);i<n;i++)if(closes[i]<ma7[i])dipped=true;
  const ma7Up=ma7[n-1]>ma7[n-4];
  const backAbove=closes[n-1]>ma7[n-1];
  const dist=(closes[n-1]-ma7[n-1])/ma7[n-1]*100;
  return dipped&&ma7Up&&backAbove&&dist<1.5;
}
function calcEntry(ind,pb){
  let e=0;
  if(ind.dist>=0.5&&ind.dist<=3)e+=2;else if(ind.dist>=0&&ind.dist<0.5)e+=1;else if(ind.dist>3&&ind.dist<=4)e+=1;
  if(ind.dd<=2)e+=1;
  if(ind.mono>=90)e+=1;
  if(ind.slope>=2&&ind.slope<=8)e+=1;
  if(pb)e+=1;
  return Math.min(5,e);
}
function calcHealth(ind){
  let h=100;
  h-=(100-ind.mono)*0.4;
  if(ind.dd>1)h-=(ind.dd-1)*5;
  if(ind.dist>4)h-=(ind.dist-4)*4;
  if(ind.slope>8)h-=(ind.slope-8)*3;
  if(ind.slope<0)h-=15;
  if(ind.gain>30)h-=(ind.gain-30);
  return Math.max(0,Math.min(100,Math.round(h)));
}
function calcENA2(closes){
  if(!closes||closes.length<30)return null;
  const ind=calcIndicators(closes);
  const quality=calcQuality(ind),stage=calcStage(ind);
  const pullback=detectPullback(closes,ind.ma7);
  const entry=calcEntry(ind,pullback),health=calcHealth(ind);
  return{quality,stage,entry,health,pullback,ind};
}

// ═══════════ 展示辅助 ═══════════
const STG_META={
  STARTING:{label:'🆕 启动',cls:'start'},
  ACCELERATION:{label:'🔥 加速',cls:'accel'},
  MATURE:{label:'🟠 成熟',cls:'mature'},
  OVEREXTENDED:{label:'⚠️ 过热',cls:'over'},
  DECLINING:{label:'📉 衰退',cls:'decl'}
};
function entryMeta(e){
  if(e>=4)return{label:'🟢 优秀',cls:'good'};
  if(e>=2.5)return{label:'🟡 观望',cls:'wait'};
  if(e>=1)return{label:'🔵 早期',cls:'early'};
  return{label:'⛔ 回避',cls:'avoid'};
}
function stageNote(st){
  if(st==='STARTING')return'📌 趋势刚形成：MA7 拐头，价格刚站上，早期机会';
  if(st==='ACCELERATION')return'🔥 加速段：MA7 持续上行，斜率健康，最佳参与区';
  if(st==='MATURE')return'🟠 成熟段：涨幅已大，注意不再追高';
  if(st==='OVEREXTENDED')return'🚨 过热：偏离/斜率过大，均值回归风险高';
  return'📉 衰退：斜率转负或深回撤，趋势受损';
}
function entryNote(e){
  if(e>=4)return'✅ 入场位置好（贴线/回踩后重新向上）';
  if(e>=2.5)return'🟡 位置尚可，等回踩或突破确认';
  if(e>=1)return'🔵 早期/偏离，性价比一般';
  return'⛔ 当前位置差，不建议入场';
}
function noteDist(d){
  if(d<0)return'⚠️ 价格跌破MA7，趋势暂弱';
  if(d<=1)return'📌 启动区：刚站上均线';
  if(d<=4)return'⭐️ 最佳区：贴线健康上涨';
  if(d<=6)return'🟠 延伸区：偏离加大，注意回踩';
  return'🚨 追高区：严重偏离，警惕均值回归';
}
function noteGain(g){
  if(g<5)return'📉 启动不足（<5%）';
  if(g<15)return'📌 健康区（5~15%）';
  if(g<25)return'✅ 强趋势（15~25%）';
  if(g<=35)return'⚠️ 高强度（25~35%）';
  return'🚨 过热（>35%），慎追';
}
function noteMono(m){
  if(m>=95)return'✅ 最佳（95~100%）';
  if(m>=90)return'🟢 优秀（90~95%）';
  if(m>=80)return'🟡 健康（80~90%）';
  return'⚠️ 震荡增加（<80%）';
}
function noteSlope(s){
  if(s<=0)return'📉 斜率转负';
  if(s<2)return'📌 平缓蓄势';
  if(s<=8)return'✅ 温和加速（最佳）';
  if(s<=12)return'⚠️ 加速偏快';
  return'🚨 陡峭拉升，风险高';
}
function noteDD(d){
  if(d<=1)return'✅ 无回撤';
  if(d<=3)return'🟡 小幅回撤，正常';
  if(d<=5)return'⚠️ 回撤加深';
  return'❌ 深回撤，趋势受损';
}

// ═══════════ 数据获取 ═══════════
async function getKlines(sym,interval,limit){
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${interval}&limit=${limit}`);
  const j=await r.json();
  return j.map(k=>({t:Math.floor(k[0]/1000),o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
}

// ═══════════ 扫描 ═══════════
async function scanAll(){
  $('btnScan').disabled=true;
  $('status').textContent='获取市场列表...';
  try{
    const tickers=await fetch('https://api.binance.com/api/v3/ticker/24hr').then(r=>r.json());
    const skip=s=>/UP|DOWN|BULL|BEAR|USD1|FDUSD|USDC|TUSD|EUR|BUSD|DAI|PAXG|AEUR|BRL|TRY|ZAR|UAH|IDRT|NGN|RUB|USDP|XUSD|USTC|USDD|SUSHI.*USD/.test(s);
    let coins=tickers.filter(x=>x.symbol.endsWith('USDT')&&!skip(x.symbol))
      .sort((a,b)=>+b.quoteVolume-+a.quoteVolume)
      .slice(0,40).map(x=>x.symbol.replace('USDT',''));
    $('status').textContent=`扫描 ${coins.length} 个币种 (1H)...`;
    // 读取上次分数（Δ）
    let prev={};try{prev=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){}
    const results=[];
    for(let i=0;i<coins.length;i+=6){
      const batch=coins.slice(i,i+6);
      await Promise.all(batch.map(async c=>{
        try{
          const kl=await getKlines(c,'1h',40);
          const r=calcENA2(kl.map(x=>x.c));
          if(!r)return;
          const t=tickers.find(x=>x.symbol===c+'USDT');
          const qPrev=prev[c];
          const delta=qPrev===undefined?null:Math.round((r.quality-qPrev)*10)/10;
          results.push({sym:c,r,chg:t?+t.priceChangePercent:0,delta,kl:kl});
        }catch(e){}
      }));
      $('status').textContent=`扫描中... ${Math.min(i+6,coins.length)}/${coins.length}`;
    }
    // 存本次分数
    const now={};results.forEach(x=>now[x.sym]=x.r.quality);
    try{localStorage.setItem(LS_KEY,JSON.stringify(now))}catch(e){}
    results.sort((a,b)=>b.r.quality-a.r.quality);
    RADAR_DATA=results;
    renderTable(results);
    $('status').textContent=`✅ ${results.length} 个币种 · ${new Date().toLocaleTimeString()} · 点击行看详情`;
  }catch(e){$('status').textContent='❌ 扫描失败: '+e.message}
  $('btnScan').disabled=false;
}

// ═══════════ 筛选 ═══════════
function setFilter(f){
  CUR_FILTER=f;
  ['all','start','accel','pb','over','decl'].forEach(x=>$('f_'+x).className=x===f?'on':'');
  renderTable(RADAR_DATA);
}
function passFilter(r){
  if(CUR_FILTER==='all')return true;
  if(CUR_FILTER==='start')return r.r.stage==='STARTING';
  if(CUR_FILTER==='accel')return r.r.stage==='ACCELERATION';
  if(CUR_FILTER==='pb')return r.r.pullback;
  if(CUR_FILTER==='over')return r.r.stage==='OVEREXTENDED';
  if(CUR_FILTER==='decl')return r.r.stage==='DECLINING';
  return true;
}

// ═══════════ 表格 ═══════════
function renderTable(rows){
  const tb=$('tbody');tb.innerHTML='';
  rows.filter(passFilter).forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.style.cursor='pointer';
    tr.onclick=()=>showDetail(r);
    const q=r.r.quality,ind=r.r.ind;
    const stg=STG_META[r.r.stage];
    const em=entryMeta(r.r.entry);
    const qCls=q>=8?'s':(q>=6?'a':'n');
    const deltaHtml=r.delta===null?'<span class="delta new">NEW</span>'
      :(r.delta>=0.3?`<span class="delta up">↑+${r.delta.toFixed(1)}</span>`
      :(r.delta<=-0.3?`<span class="delta down">↓${r.delta.toFixed(1)}</span>`:'<span class="delta" style="color:var(--dim)">—</span>'));
    tr.innerHTML=`<td>${i+1}</td>
      <td class="sym"><a href="https://www.binance.com/zh-CN/trade/${r.sym}_USDT" target="_blank">${r.sym}</a>${r.r.pullback?' <span class="pb">回踩</span>':''}</td>
      <td class="score ${qCls}"><span class="qbar"><i style="width:${q*10}%"></i></span>${q.toFixed(1)}</td>
      <td><span class="stg ${stg.cls}">${stg.label}</span></td>
      <td><span class="entryTag et ${em.cls}">${em.label}</span></td>
      <td class="${ind.dist>4?'down':(ind.dist>=0?'up':'down')}">${ind.dist>=0?'+':''}${ind.dist.toFixed(1)}%</td>
      <td class="${ind.gain>=15?'up':(ind.gain>=5?'n':'down')}">${ind.gain>=0?'+':''}${ind.gain.toFixed(1)}%</td>
      <td class="${ind.mono>=90?'up':(ind.mono>=80?'n':'down')}">${ind.mono.toFixed(0)}%</td>
      <td class="${ind.slope>12?'down':(ind.slope>=2?'up':'n')}">${ind.slope>=0?'+':''}${ind.slope.toFixed(1)}%</td>
      <td class="${ind.dd>3?'down':'up'}">-${ind.dd.toFixed(1)}%</td>
      <td>${deltaHtml}</td>
      <td class="${r.chg>=0?'up':'down'}">${r.chg>=0?'+':''}${r.chg.toFixed(1)}%</td>`;
    tb.appendChild(tr);
  });
  if(!tb.children.length)tb.innerHTML='<tr><td colspan="12" style="color:var(--dim);text-align:center;padding:20px">该筛选下暂无币种</td></tr>';
}

// ═══════════ 交易计划（保留 v1）═══════════
function calcATR(kl,n=14){
  if(!kl||kl.length<n+1)return null;
  const trs=[];
  for(let i=1;i<kl.length;i++){
    const h=kl[i].h,l=kl[i].l,pc=kl[i-1].c;
    trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
  }
  const seg=trs.slice(-n);
  return seg.reduce((a,b)=>a+b,0)/n;
}
function calcPlan(kl){
  if(!kl||kl.length<30)return null;
  const closes=kl.map(x=>x.c);
  const entry=closes[closes.length-1];
  const atr=calcATR(kl);
  if(!atr||atr<=0)return null;
  const look=kl.slice(-24);
  const swingLow=Math.min(...look.map(x=>x.l));
  const swingHigh=Math.max(...look.map(x=>x.h));
  const slLong=swingLow-atr*0.3;
  const tp1Long=swingHigh;
  const tp2Long=swingHigh+atr*1.5;
  const rr1=(tp1Long-entry)/(entry-slLong);
  const rr2=(tp2Long-entry)/(entry-slLong);
  const slShort=swingHigh+atr*0.3;
  const tp1Short=swingLow;
  const tp2Short=swingLow-atr*1.5;
  const rrS1=(slShort-entry)/(entry-tp1Short);
  const brokeHigh=entry>swingHigh;
  const dynSL=brokeHigh?swingHigh-atr*0.2:slLong;
  return {entry,atr,swingLow,swingHigh,slLong,tp1Long,tp2Long,rr1,rr2,slShort,tp1Short,tp2Short,rrS1,brokeHigh,dynSL};
}
function rrNote(rr){
  if(rr>=2.5)return'✅ 盈亏比理想 (≥2.5)';
  if(rr>=1.5)return'🟡 盈亏比合格 (≥1.5)';
  return'❌ 盈亏比不足 (<1.5)，建议放弃';
}
function posAdvice(q,entry,stage){
  if(stage==='OVEREXTENDED'||stage==='DECLINING')return{pct:'0%',note:'⛔ 阶段不佳：空仓观望',cls:'no'};
  if(q>=8&&entry>=3)return{pct:'20~30%',note:'🔥 高质量+好位置：积极做多',cls:'ok'};
  if(q>=6.5&&entry>=2)return{pct:'15~20%',note:'🟡 趋势尚可：试探性参与',cls:'wait'};
  return{pct:'0%',note:'⚪️ 信号弱：空仓观望',cls:'no'};
}

// ═══════════ 详情 ═══════════
let detailChart=null;
async function showDetail(r){
  const d=$('detail');d.style.display='block';
  const ind=r.r.ind,q=r.r.quality;
  const stg=STG_META[r.r.stage],em=entryMeta(r.r.entry);
  const hCls=r.r.health>=80?'ok':(r.r.health>=60?'wait':'no');
  const hColor=r.r.health>=80?'var(--green)':(r.r.health>=60?'var(--yellow)':'var(--red)');
  d.innerHTML=`<h2>${r.sym} <span class="stg ${stg.cls}">${stg.label}</span> <span class="entryTag et ${em.cls}">入场 ${em.label}</span> ${r.r.pullback?'<span class="pb">🔄 健康回踩</span>':''}</h2>
  <div class="metrics">
    <div class="metric"><div class="k">🎯 趋势质量 Quality</div><div class="v"><span class="qbar" style="width:90px"><i style="width:${q*10}%;background:${q>=8?'var(--green)':(q>=6?'var(--yellow)':'var(--red)')}"></i></span>${q.toFixed(1)}/10</div><div class="s">趋势有多漂亮</div></div>
    <div class="metric"><div class="k">📈 趋势阶段</div><div class="v">${stg.label}</div><div class="s">${stageNote(r.r.stage)}</div></div>
    <div class="metric"><div class="k">🎯 入场质量</div><div class="v">${r.r.entry}/5 <span class="entryTag et ${em.cls}" style="margin-left:6px">${em.label}</span></div><div class="s">${entryNote(r.r.entry)}</div></div>
    <div class="metric"><div class="k">💚 趋势健康度</div><div class="v"><span class="hbar"><i style="width:${r.r.health}%;background:${hColor}"></i></span><b class="${hCls}">${r.r.health}</b></div><div class="s">${r.r.health>=80?'✅ 健康':(r.r.health>=60?'🟡 一般':'❌ 脆弱')}</div></div>
    <div class="metric"><div class="k">① 距 MA7 · ${ind.dist>=0?'+':''}${ind.dist.toFixed(1)}%</div><div class="v ${ind.dist>4?'down':(ind.dist>=0?'up':'down')}">${noteDist(ind.dist)}</div></div>
    <div class="metric"><div class="k">② MA7 20根涨幅 · ${ind.gain>=0?'+':''}${ind.gain.toFixed(1)}%</div><div class="v ${ind.gain>=25?'down':(ind.gain>=5?'up':'n')}">${noteGain(ind.gain)}</div></div>
    <div class="metric"><div class="k">③ MA7 单调性 · ${ind.mono.toFixed(0)}%</div><div class="v ${ind.mono>=90?'up':(ind.mono>=80?'n':'down')}">${noteMono(ind.mono)}</div></div>
    <div class="metric"><div class="k">④ 末5根斜率 · ${ind.slope>=0?'+':''}${ind.slope.toFixed(1)}%</div><div class="v ${ind.slope>12?'down':(ind.slope>=2?'up':'n')}">${noteSlope(ind.slope)}</div></div>
    <div class="metric"><div class="k">⑤ 峰值回撤 · -${ind.dd.toFixed(1)}%</div><div class="v ${ind.dd>3?'down':'up'}">${noteDD(ind.dd)}</div></div>
    <div class="metric"><div class="k">24h 涨跌</div><div class="v ${r.chg>=0?'up':'down'}">${r.chg>=0?'+':''}${r.chg.toFixed(1)}%</div><div class="s">市场热度参考</div></div>
  </div>
  <div class="entry">
    <div style="font-weight:bold;color:var(--cyan)">🎯 综合判断</div>
    <div class="row"><span>1H 趋势：<b class="${q>=8?'ok':(q>=6?'wait':'no')}">${q.toFixed(1)}/10</b></span>
    <span>阶段：<b>${stg.label}</b></span>
    <span>入场：<span id="entryState" class="${em.cls==='good'?'ok':(em.cls==='wait'?'wait':'no')}">${em.label}</span></span>
    <span>15m 状态：<span id="m15state" class="wait">检测中...</span></span></div>
  </div>
  <div class="entry" id="planBox" style="margin-top:10px">
    <div style="font-weight:bold;color:var(--yellow)">📐 交易计划（动态止盈止损框架）</div>
    <div class="row" id="planBody">计算中...</div>
  </div>
  <div id="chartBox"></div>`;
  checkEntry15m(r);
  renderPlan(r);
  drawChart(r);
}

function renderPlan(r){
  const plan=calcPlan(r.kl||[]);
  const body=$('planBody');
  if(!plan){body.innerHTML='<span class="no">数据不足，无法计算</span>';return}
  const pa=posAdvice(r.r.quality,r.r.entry,r.r.stage);
  const fmt=v=>'$'+v.toFixed(v>=1000?0:2);
  const dynNote=plan.brokeHigh
    ? `<span class="ok">🔒 已突破前高 → 止损上移 ${fmt(plan.dynSL)}（锁利润）</span>`
    : `<span class="wait">📌 结构止损 ${fmt(plan.slLong)}（跌破=多头失效）</span>`;
  body.innerHTML=`
    <span>入场参考：<b class="up">${fmt(plan.entry)}</b>（现价）· ATR(1H)：${fmt(plan.atr)}</span>
    <span>🛡 止损：<b class="down">${fmt(plan.brokeHigh?plan.dynSL:plan.slLong)}</b> ${dynNote}</span>
    <span>🎯 TP1：<b class="up">${fmt(plan.tp1Long)}</b>（前高）· TP2：<b class="up">${fmt(plan.tp2Long)}</b>（前高+1.5ATR）</span>
    <span>📊 盈亏比：<b>1:${plan.rr1>=0?plan.rr1.toFixed(1):'∞'}</b> <span class="${plan.rr1>=2.5?'ok':(plan.rr1>=1.5?'wait':'no')}">${rrNote(plan.rr1)}</span></span>
    <span>💼 仓位建议：<b class="${pa.cls}">${pa.pct}</b> ${pa.note}</span>
    ${plan.brokeHigh?'':`<span class="dim" style="color:var(--dim)">💡 TP1 平一半锁利，剩余看 TP2；跌破止损无条件离场</span>`}`;
}

async function checkEntry15m(r){
  try{
    const kl=await getKlines(r.sym,'15m',60);
    if(!kl||kl.length<20){$('m15state').textContent='数据不足';return}
    const closes=kl.map(x=>x.c);
    const ma7=calcMA7(closes);
    const cur=closes[closes.length-1],curMA7=ma7[ma7.length-1];
    const prevHigh=Math.max(...closes.slice(-20,-1));
    const vol=kl.slice(-5).reduce((a,x)=>a+x.v,0)/5;
    const volPrev=kl.slice(-10,-5).reduce((a,x)=>a+x.v,0)/5;
    const inPullback=cur<curMA7*1.005;
    const brokeHigh=cur>prevHigh;
    const volOk=vol>volPrev*1.2;
    const st=$('m15state');
    if(brokeHigh&&volOk){st.textContent='突破+放量 ✅';st.className='ok';$('entryState').textContent='🟢 BUY 信号';$('entryState').className='ok'}
    else if(inPullback){st.textContent='回踩中';st.className='wait';$('entryState').textContent='🟡 等待突破前高';$('entryState').className='wait'}
    else if(cur>curMA7){st.textContent='MA7上方运行';st.className='ok';$('entryState').textContent='🟡 等待回踩或突破';$('entryState').className='wait'}
    else{st.textContent='跌破MA7';st.className='no';$('entryState').textContent='⚪️ 结构破坏，不追';$('entryState').className='no'}
  }catch(e){$('m15state').textContent='--'}
}

function drawChart(r){
  const box=$('chartBox');box.innerHTML='';
  if(detailChart)try{detailChart.remove()}catch(e){}
  const w=box.clientWidth,h=260,pad=8;
  const kl=r.kl.slice(-40);
  const closes=r.kl.map(x=>x.c);
  const min=Math.min(...closes.slice(-40)),max=Math.max(...closes.slice(-40));
  const range=max-min||1;
  const x=i=>pad+i*(w-pad*2)/(kl.length-1);
  const y=v=>h-pad-(v-min)/range*(h-pad*2);
  let svg=`<svg width="${w}" height="${h}" style="background:var(--panel2);border-radius:6px">`;
  const ma7=calcMA7(closes).slice(-40);
  let pts='';
  for(let i=0;i<ma7.length;i++)pts+=`${i===0?'':','}${x(i).toFixed(1)},${y(ma7[i]).toFixed(1)}`;
  svg+=`<polyline points="${pts}" fill="none" stroke="#f5c518" stroke-width="1.5" opacity="0.9"/>`;
  pts='';
  for(let i=0;i<kl.length;i++)pts+=`${i===0?'':','}${x(i).toFixed(1)},${y(kl[i].c).toFixed(1)}`;
  svg+=`<polyline points="${pts}" fill="none" stroke="#00c896" stroke-width="1.5"/>`;
  svg+=`</svg>`;
  box.innerHTML=svg;
}

// 自动扫描
scanAll();
// 每3分钟自动刷新
let countdown=180;
setInterval(()=>{
  countdown--;
  const st=$('status');
  if(!st.textContent.includes('扫描中')){
    const m=Math.floor(countdown/60),s=countdown%60;
    st.textContent=`⏱ 下次刷新 ${m}:${String(s).padStart(2,'0')} · ${st.textContent.replace(/^⏱[^·]*· /,'')}`;
  }
  if(countdown<=0){countdown=180;scanAll()}
},1000);
// 后台标签页节能修复
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const st=$('status');
    const m=st.textContent.match(/(\d{1,2}:\d{2}:\d{2})/);
    if(m){
      const parts=m[1].split(':').map(Number);
      const now=new Date();
      const last=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parts[0],parts[1],parts[2]);
      if(now-last>60000){countdown=180;scanAll()}
    }else{countdown=180;scanAll()}
  }
});
</script>
