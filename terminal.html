<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Crypto Intelligence Terminal</title>
<style>
:root{--bg:#071018;--panel:#0b1722;--panel2:#0e1c29;--line:#1c2d3c;--text:#eaf2f9;--muted:#7f92a4;--cyan:#55d8ff;--green:#35d49a;--red:#ff6577;--yellow:#f6c85f;--blue:#6e9cff;--purple:#ae7cff;--shadow:0 16px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#102234 0,#071018 38%,#050b11 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
button,input,select{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(5,11,17,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{height:64px;display:flex;align-items:center;gap:20px;padding:0 22px}.brand{font-weight:800;letter-spacing:.08em;display:flex;align-items:center;gap:10px;min-width:245px}.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}.search{flex:1;max-width:380px;position:relative}.search input{width:100%;padding:10px 14px 10px 38px;background:#08131d;border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}.search:before{content:'⌕';position:absolute;left:13px;top:7px;color:var(--muted);font-size:19px}.right{margin-left:auto;display:flex;align-items:center;gap:12px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.nav{display:flex;gap:4px;padding:0 18px 10px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}.nav button:hover,.nav button.active{color:var(--text);background:#0f2230}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1700px;margin:0 auto}.main{min-width:0}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card,.panel{background:linear-gradient(180deg,rgba(15,29,42,.98),rgba(8,18,27,.98));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:15px}.klabel{color:var(--muted);font-size:12px}.kvalue{font-size:25px;font-weight:800;margin-top:6px}.kmeta{margin-top:7px;font-size:12px;color:var(--muted)}.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--yellow)}.panel{padding:15px;margin-top:12px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.paneltitle{font-size:14px;font-weight:750;letter-spacing:.02em}.sub{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar select,.toolbar input{background:#08131d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px}.toolbar button,.primary{border:1px solid #29485c;background:#0f2432;color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer}.primary{background:#123145;border-color:#2a617a}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.timeline{max-height:510px;overflow:auto}.evt{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:10px 2px;border-bottom:1px dashed #1d2c37}.evt:last-child{border-bottom:0}.sev{width:7px;height:7px;border-radius:50%;margin-top:5px}.sev.high{background:var(--red);box-shadow:0 0 8px var(--red)}.sev.medium{background:var(--yellow)}.sev.info{background:var(--blue)}.evtmain{font-size:12px}.evtmain b{font-weight:750}.evtmeta{font-size:10px;color:var(--muted);margin-top:4px}.score{font-size:11px;padding:4px 7px;border-radius:999px;background:#101e29;color:var(--muted);height:max-content}.bars{display:flex;flex-direction:column;gap:10px}.barrow{display:grid;grid-template-columns:66px 1fr 62px;gap:8px;align-items:center;font-size:11px}.bar{height:7px;background:#0a131b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:inherit}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #152531;text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:600;position:sticky;top:0;background:#0b1722}.pill{padding:3px 6px;border-radius:999px;font-size:10px;background:#13202b;border:1px solid #223747}.side .panel{margin-top:0}.side .panel + .panel{margin-top:12px}.health{display:grid;grid-template-columns:1fr 1fr;gap:8px}.h{padding:10px;background:#09141d;border:1px solid #182a38;border-radius:10px}.hline{display:flex;justify-content:space-between;font-size:11px}.mini{font-size:10px;color:var(--muted);margin-top:4px}.chart{height:190px;display:flex;align-items:stretch;gap:6px;padding:8px 2px 0}.col{flex:1;display:flex;align-items:flex-end;gap:2px}.cbar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--cyan),#1a6d86);min-height:2px}.legend{display:flex;gap:12px;color:var(--muted);font-size:10px}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}.empty{padding:26px;color:var(--muted);text-align:center;border:1px dashed #223747;border-radius:10px}.page{display:none}.page.active{display:block}.formrow{display:grid;grid-template-columns:1fr 160px 120px auto;gap:8px}.note{color:var(--muted);font-size:11px;line-height:1.6}.sourceflag{font-size:10px;padding:3px 7px;border-radius:999px;background:#10212c;border:1px solid #243847}.sourceflag.live{color:var(--green)}.sourceflag.cfg{color:var(--yellow)}.sourceflag.off{color:var(--red)}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{display:none}}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.brand{min-width:auto}.formrow{grid-template-columns:1fr 1fr}.nav{padding-bottom:8px}.layout{padding:10px}.topbar{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="topbar">
  <div class="brand"><span class="brand-dot"></span>CRYPTO INTELLIGENCE TERMINAL</div>
  <div class="search"><input id="globalSearch" placeholder="币种检索，如 BTC"/></div>
  <div class="right"><div class="status"><span class="dot"></span><span id="connText">快照</span></div><div class="sub" id="updated">--</div></div>
 </div>
 <nav class="nav" id="nav"></nav>
</header>

<main class="layout">
<section class="main">
<div id="overview" class="page active"></div>
<div id="whale" class="page"></div>
<div id="pool" class="page"></div>
<div id="spread" class="page"></div>
<div id="flow" class="page"></div>
<div id="sentiment" class="page"></div>
<div id="macro" class="page"></div>
<div id="etf" class="page"></div>
<div id="options" class="page"></div>
<div id="system" class="page"></div>
</section>
<aside class="side">
 <div class="panel"><div class="panelhead"><div class="paneltitle">数据源状态</div><span class="sourceflag live">ENGINE</span></div><div class="health" id="health"></div></div>
 <div class="panel"><div class="panelhead"><div class="paneltitle">实时告警</div><span class="sub">UTC</span></div><div id="sideAlerts" class="timeline"></div></div>
 <div class="panel"><div class="panelhead"><div class="paneltitle">TG 推送</div><button class="primary" onclick="tgTest()">状态</button></div><div class="note">只在达到金额阈值并满足异常评分条件时推送。Bot Token / Chat ID 永远保存在服务器环境变量。</div></div>
</aside>
</main>
</div>
<script>
const navs=[['overview','总览'],['whale','鲸鱼监控'],['pool','监控池'],['spread','价差与异动'],['flow','资金流'],['sentiment','市场情绪'],['macro','宏观周期'],['etf','ETF 资金流'],['options','加密期权'],['system','系统管理']];
let SNAP={market:{},derivatives:{},events:[],watchlist:[],health:{},updated:null,fearGreed:null,options:{},liquidations:[]};
const fmtUSD=v=>{v=Number(v||0); if(v>=1e9)return '$'+(v/1e9).toFixed(2)+'B'; if(v>=1e6)return '$'+(v/1e6).toFixed(2)+'M'; if(v>=1e3)return '$'+(v/1e3).toFixed(1)+'K'; return '$'+v.toFixed(0)};
const fmtNum=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setNav(){document.getElementById('nav').innerHTML=navs.map((n,i)=>`<button class="${i===0?'active':''}" onclick="showPage('${n[0]}',this)">${n[1]}</button>`).join('')}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderPage(id)}
function healthRender(){const h=SNAP.health||{};const labels={binance:'Binance 行情',derivatives:'合约数据',options:'期权',fearGreed:'情绪',onchain:'链上 Webhook',etf:'ETF',macro:'宏观',telegram:'Telegram'};document.getElementById('health').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="h"><div class="hline"><span>${v}</span><b class="${h[k]?'up':'warn'}">${h[k]?'LIVE':'CONFIG'}</b></div><div class="mini">${k==='onchain'?h.onchainMode:'实时/可选源'}</div></div>`).join('');}
function evtHtml(e){return `<div class="evt"><span class="sev ${e.severity||'info'}"></span><div class="evtmain"><b>${esc(e.symbol||'UNKNOWN')}</b> ${esc(e.category||'链上事件')} · ${fmtUSD(e.usd)}<div class="evtmeta">${esc(e.from_label||e.source||'')} → ${esc(e.to_label||'Unknown')} · ${esc(e.chain||'')} · ${new Date(e.ts).toISOString().slice(5,19).replace('T',' ')}</div></div><div class="score">${e.score?e.score+'/10':'--'}</div></div>`}
function marketCards(){const m=SNAP.market||{},d=SNAP.derivatives||{};const btc=m.BTCUSDT||{},eth=m.ETHUSDT||{},sol=m.SOLUSDT||{};const bd=d.BTCUSDT||{};return `<div class="cards"><div class="card"><div class="klabel">BTC</div><div class="kvalue">$${fmtNum(btc.price)}</div><div class="kmeta ${btc.change24>=0?'up':'down'}">24H ${btc.change24>=0?'+':''}${fmtNum(btc.change24)}%</div></div><div class="card"><div class="klabel">ETH</div><div class="kvalue">$${fmtNum(eth.price)}</div><div class="kmeta ${eth.change24>=0?'up':'down'}">24H ${eth.change24>=0?'+':''}${fmtNum(eth.change24)}%</div></div><div class="card"><div class="klabel">SOL</div><div class="kvalue">$${fmtNum(sol.price)}</div><div class="kmeta ${sol.change24>=0?'up':'down'}">24H ${sol.change24>=0?'+':''}${fmtNum(sol.change24)}%</div></div><div class="card"><div class="klabel">BTC Funding</div><div class="kvalue">${(bd.funding*100).toFixed(4)}%</div><div class="kmeta">多空比 ${fmtNum(bd.longShort)}</div></div><div class="card"><div class="klabel">Fear & Greed</div><div class="kvalue">${SNAP.fearGreed?SNAP.fearGreed.value:'--'}</div><div class="kmeta">${esc(SNAP.fearGreed?.classification||'CONFIG')}</div></div></div>`}
async function flowData(hours=24){return ((SNAP.flows||{})[String(hours)]||[])}
function miniBars(rows){if(!rows.length)return '<div class="empty">暂无链上事件</div>';const max=Math.max(...rows.map(x=>Number(x.usd)||0),1);return `<div class="bars">${rows.slice(0,10).map(x=>`<div class="barrow"><b>${esc(x.symbol)}</b><div class="bar"><i style="width:${Math.max(2,(x.usd/max)*100)}%"></i></div><span>${fmtUSD(x.usd)}</span></div>`).join('')}</div>`}
function overview(){const ev=SNAP.events||[];const counts={high:0,medium:0,info:0};ev.forEach(e=>counts[e.severity]=(counts[e.severity]||0)+1);const byCat={};ev.forEach(e=>byCat[e.category||'其他']=(byCat[e.category||'其他']||0)+1);return `${marketCards()}<div class="grid2"><div class="panel"><div class="panelhead"><div><div class="paneltitle">告警时间线</div><div class="sub">实时 · ${ev.length} events</div></div><div class="toolbar"><select onchange="filterOverview(this.value)"><option value="">全部级别</option><option value="high">高</option><option value="medium">中</option><option value="info">提示</option></select></div></div><div id="ovTimeline" class="timeline">${ev.length?ev.slice(0,50).map(evtHtml).join(''):'<div class="empty">等待实时告警</div>'}</div></div><div class="panel"><div class="panelhead"><div class="paneltitle">重点概览</div><span class="sub">Severity</span></div><div class="grid3"><div class="card"><div class="klabel">高危</div><div class="kvalue down">${counts.high||0}</div></div><div class="card"><div class="klabel">中等</div><div class="kvalue warn">${counts.medium||0}</div></div><div class="card"><div class="klabel">提示</div><div class="kvalue">${counts.info||0}</div></div></div><div style="height:12px"></div><div class="bars">${Object.entries(byCat).slice(0,9).map(([k,v])=>`<div class="barrow"><b>${esc(k)}</b><div class="bar"><i style="width:${Math.min(100,v*8)}%"></i></div><span>${v}</span></div>`).join('')||'<div class="empty">暂无分类</div>'}</div></div></div><div class="grid2"><div class="panel"><div class="panelhead"><div class="paneltitle">高频币种 / Binance 流出</div><span class="sub">24H</span></div><div id="flowBars"></div></div><div class="panel"><div class="panelhead"><div class="paneltitle">近期清算</div><span class="sub">Binance Futures</span></div><div>${(SNAP.liquidations||[]).slice(-12).reverse().map(x=>`<div class="evt"><span class="sev ${x.side==='SELL'?'down':'medium'}"></span><div class="evtmain"><b>${x.symbol}</b> ${fmtUSD(x.usd)}<div class="evtmeta">${x.side||''} · ${new Date(x.time).toISOString().slice(11,19)} UTC</div></div><div class="score">LIQ</div></div>`).join('')||'<div class="empty">暂无近期样本</div>'}</div></div></div>`}
async function renderOverview(){document.getElementById('overview').innerHTML=overview();const rows=await flowData(24);document.getElementById('flowBars').innerHTML=miniBars(rows)}
function tableEvents(){const ev=SNAP.events||[];return `<div class="panel"><div class="panelhead"><div class="paneltitle">链上大额转账</div><div class="toolbar"><select id="esym"><option value="">全部币种</option>${[...new Set(ev.map(e=>e.symbol))].filter(Boolean).slice(0,60).map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="esev"><option value="">全部级别</option><option value="high">高</option><option value="medium">中</option><option value="info">提示</option></select><button onclick="applyEventFilters()">筛选</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>时间</th><th>币种</th><th>USD</th><th>来源</th><th>去向</th><th>网络</th><th>Score</th><th>级别</th></tr></thead><tbody id="eventRows">${ev.map(e=>`<tr><td>${new Date(e.ts).toISOString().slice(5,19).replace('T',' ')}</td><td><b>${esc(e.symbol)}</b></td><td>${fmtUSD(e.usd)}</td><td>${esc(e.from_label||e.source||'')}</td><td>${esc(e.to_label||'Unknown')}</td><td>${esc(e.chain||'')}</td><td>${e.score||'--'}</td><td><span class="pill">${e.severity||''}</span></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">暂无实时链上事件。请接入 Arkham/Whale Alert 等 Webhook。</div></td></tr>'}</tbody></table></div></div>`}
function whale(){return `${marketCards()}<div class="panel"><div class="panelhead"><div><div class="paneltitle">鲸鱼监控</div><div class="sub">交易所钱包 / Whale / Market Maker / Deposit</div></div><span class="sourceflag live">WEBHOOK READY</span></div>${tableEvents()}</div>`}
function pool(){const w=SNAP.watchlist||[];return `<div class="panel"><div class="panelhead"><div><div class="paneltitle">监控池</div><div class="sub">自定义币种、阈值、TG 开关</div></div></div><div class="formrow"><input id="wSym" placeholder="例如 ZEC"/><input id="wTh" type="number" value="1000000"/><select id="wTg"><option value="1">TG 开</option><option value="0">TG 关</option></select><button class="primary" onclick="addWatch()">添加 / 更新</button></div><div style="height:12px"></div><div class="tablewrap"><table class="table"><thead><tr><th>币种</th><th>阈值</th><th>TG</th><th>备注</th><th></th></tr></thead><tbody>${w.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${fmtUSD(x.threshold_usd)}</td><td>${x.tg_enabled?'ON':'OFF'}</td><td>${esc(x.notes||'')}</td><td><button onclick="delWatch('${esc(x.symbol)}')">删除</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">暂无监控项</div></td></tr>'}</tbody></table></div></div>`}
function spread(){const m=SNAP.market||{},d=SNAP.derivatives||{};return `${marketCards()}<div class="grid2"><div class="panel"><div class="panelhead"><div class="paneltitle">现货 / 永续价差</div><span class="sub">Binance</span></div>${['BTCUSDT','ETHUSDT','SOLUSDT'].map(s=>{const a=m[s]||{},b=d[s]||{};const basis=a.price&&b.markPrice?(b.markPrice/a.price-1)*100:0;return `<div class="evt"><span class="sev ${basis>0?'info':'medium'}"></span><div class="evtmain"><b>${s}</b><div class="evtmeta">Spot $${fmtNum(a.price)} · Mark $${fmtNum(b.markPrice)}</div></div><div class="score">${basis.toFixed(3)}%</div></div>`}).join('')}</div><div class="panel"><div class="panelhead"><div class="paneltitle">异常观察</div></div><div class="note">期现价差、跨交易所价差、池内价格偏离可以继续接入独立数据源。当前版本先提供 Binance 现货 / 永续基础差值。</div></div></div>`}
function flow(){return `${marketCards()}<div class="panel"><div class="panelhead"><div class="paneltitle">资金流</div><span class="sub">Binance Webhook + Futures Context</span></div><div class="grid3"><div class="card"><div class="klabel">24H 流出</div><div class="kvalue" id="f24">--</div></div><div class="card"><div class="klabel">4H 流出</div><div class="kvalue" id="f4">--</div></div><div class="card"><div class="klabel">1H 流出</div><div class="kvalue" id="f1">--</div></div></div><div style="height:12px"></div><div id="flowTable"></div></div>`}
function sentiment(){const d=SNAP.derivatives||{},fg=SNAP.fearGreed;return `${marketCards()}<div class="grid3">${['BTCUSDT','ETHUSDT','SOLUSDT'].map(s=>{const x=d[s]||{};return `<div class="panel"><div class="panelhead"><div class="paneltitle">${s}</div><span class="sourceflag live">BINANCE</span></div><div class="klabel">Funding</div><div class="kvalue">${(x.funding*100).toFixed(4)}%</div><div class="kmeta">Global L/S ${fmtNum(x.longShort)} · Top Trader L/S ${fmtNum(x.topLongShort)}</div><div class="kmeta">OI ${fmtNum(x.oi)}</div></div>`}).join('')}</div><div class="panel"><div class="panelhead"><div class="paneltitle">市场情绪</div><span class="sub">Alternative.me</span></div><div class="kvalue">${fg?fg.value:'--'}</div><div class="kmeta">${esc(fg?.classification||'尚未连接')}</div></div>`}
function macro(){return `<div class="panel"><div class="panelhead"><div class="paneltitle">宏观周期</div><span class="sourceflag ${SNAP.health?.macro?'live':'cfg'}">${SNAP.health?.macro?'LIVE':'CONFIG'}</span></div><div class="grid3"><div class="card"><div class="klabel">MVRV Z-Score</div><div class="kvalue">--</div><div class="kmeta">接入 Glassnode / CryptoQuant / 自有数据源</div></div><div class="card"><div class="klabel">BTC / M2</div><div class="kvalue">--</div><div class="kmeta">接入宏观数据源</div></div><div class="card"><div class="klabel">利率 / DXY</div><div class="kvalue">--</div><div class="kmeta">FRED 等数据源可配置</div></div></div><div style="height:12px"></div><div class="note">这一层保留了观澜式“周期/宏观”模块，但不会伪造数据。配置 MACRO_FEED_URL 或扩展数据适配器后，这里可实时显示。</div></div>`}
function etf(){return `<div class="panel"><div class="panelhead"><div class="paneltitle">ETF 资金流</div><span class="sourceflag ${SNAP.health?.etf?'live':'cfg'}">${SNAP.health?.etf?'LIVE':'CONFIG'}</span></div><div class="grid3"><div class="card"><div class="klabel">BTC ETF 今日净流</div><div class="kvalue">--</div><div class="kmeta">等待 ETF_FEED_URL</div></div><div class="card"><div class="klabel">ETH ETF 今日净流</div><div class="kvalue">--</div><div class="kmeta">等待 ETF_FEED_URL</div></div><div class="card"><div class="klabel">Combined</div><div class="kvalue">--</div><div class="kmeta">不伪造数据</div></div></div><div style="height:12px"></div><div class="note">ETF 数据通常需要稳定的专门数据源。服务器支持用 ETF_FEED_URL 注入 JSON，前端结构无需再改。</div></div>`}
function options(){const o=SNAP.options||{};return `<div class="grid2">${['BTC','ETH'].map(s=>{const x=o[s]||{};return `<div class="panel"><div class="panelhead"><div class="paneltitle">${s} Options</div><span class="sourceflag ${SNAP.health?.options?'live':'cfg'}">${SNAP.health?.options?'LIVE':'CONFIG'}</span></div><div class="klabel">Total OI</div><div class="kvalue">${fmtNum(x.openInterest)}</div><div class="kmeta">Put/Call ${x.putCall==null?'--':x.putCall.toFixed(3)} · instruments ${x.instruments||0}</div></div>`}).join('')}</div>`}
function system(){const h=SNAP.health||{};return `<div class="panel"><div class="panelhead"><div class="paneltitle">系统管理</div><span class="sub">只读状态 + 本地监控池</span></div><div class="health">${Object.entries({Binance:h.binance,Derivatives:h.derivatives,Options:h.options,FearGreed:h.fearGreed,OnchainWebhook:h.onchain,ETF:h.etf,Macro:h.macro,Telegram:h.telegram}).map(([k,v])=>`<div class="h"><div class="hline"><span>${k}</span><b class="${v?'up':'warn'}">${v?'OK':'CONFIG'}</b></div></div>`).join('')}</div><div style="height:12px"></div><div class="note">配置文件：<code>.env</code>。建议反向代理 HTTPS，并通过服务器环境变量保存 Telegram Token、Webhook Secret、外部数据源 Key。</div><div style="height:12px"></div><button class="primary" onclick="tgTest()">Telegram 状态</button></div>`}
async function renderPage(id){const el=document.getElementById(id);if(id==='overview')return renderOverview();if(id==='whale')el.innerHTML=whale();if(id==='pool')el.innerHTML=pool();if(id==='spread')el.innerHTML=spread();if(id==='flow'){el.innerHTML=flow();await renderFlow()}if(id==='sentiment')el.innerHTML=sentiment();if(id==='macro')el.innerHTML=macro();if(id==='etf')el.innerHTML=etf();if(id==='options')el.innerHTML=options();if(id==='system')el.innerHTML=system()}
async function renderFlow(){const [a,b,c]=await Promise.all([flowData(24),flowData(4),flowData(1)]);const sum=x=>x.reduce((s,r)=>s+Number(r.usd||0),0);document.getElementById('f24').textContent=fmtUSD(sum(a));document.getElementById('f4').textContent=fmtUSD(sum(b));document.getElementById('f1').textContent=fmtUSD(sum(c));document.getElementById('flowTable').innerHTML=miniBars(a)}
function filterOverview(v){const rows=(SNAP.events||[]).filter(e=>!v||e.severity===v);document.getElementById('ovTimeline').innerHTML=rows.length?rows.slice(0,60).map(evtHtml).join(''):'<div class="empty">暂无匹配事件</div>'}
function applyEventFilters(){const s=document.getElementById('esym').value,v=document.getElementById('esev').value;const rows=(SNAP.events||[]).filter(e=>(!s||e.symbol===s)&&(!v||e.severity===v));document.getElementById('eventRows').innerHTML=rows.map(e=>`<tr><td>${new Date(e.ts).toISOString().slice(5,19).replace('T',' ')}</td><td><b>${esc(e.symbol)}</b></td><td>${fmtUSD(e.usd)}</td><td>${esc(e.from_label||e.source||'')}</td><td>${esc(e.to_label||'Unknown')}</td><td>${esc(e.chain||'')}</td><td>${e.score||'--'}</td><td><span class="pill">${e.severity||''}</span></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">暂无匹配</div></td></tr>'}
async function addWatch(){alert('静态页只读：监控池需在服务端 .env / DB 配置');return;const symbol=document.getElementById('wSym').value.trim();const threshold=Number(document.getElementById('wTh').value||1000000);const tg=Number(document.getElementById('wTg').value);if(!symbol)return;await fetch('/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol,threshold_usd:threshold,tg_enabled:!!tg})});await refresh();document.querySelector('.nav button:nth-child(3)').click()}
async function delWatch(s){alert('静态页只读：监控池需在服务端 .env / DB 配置')}
async function tgTest(){alert(SNAP.health?.telegram?'服务端 Telegram 已配置（本页只读，测试请走服务端）':'服务端 Telegram 未配置')}
function side(){document.getElementById('sideAlerts').innerHTML=(SNAP.events||[]).slice(0,18).map(evtHtml).join('')||'<div class="empty">暂无告警</div>';healthRender()}
async function refresh(){try{SNAP=await fetch('data/terminal_v3.json?z='+Date.now(),{cache:'no-store'}).then(r=>r.json());document.getElementById('updated').textContent=SNAP.updated?new Date(SNAP.updated).toISOString().slice(11,19)+' UTC':'--';side();const current=document.querySelector('.page.active')?.id||'overview';await renderPage(current)}catch(e){document.getElementById('connText').textContent='OFFLINE';}}
function connectSSE(){/* 静态站：无 SSE，改为 refresh 轮询（见文件末尾） */}
function _unusedSSE(){const es=new EventSource('/events');es.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='event'){SNAP.events=[x.event,...(SNAP.events||[])].slice(0,110);side();const p=document.querySelector('.page.active')?.id;renderPage(p||'overview')}if(x.type==='snapshot'){SNAP=x.data;side()}}catch{}};es.onerror=()=>{document.getElementById('connText').textContent='RECONNECTING'}}
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const s=e.target.value.trim().toUpperCase();if(!s)return;showPage('whale',document.querySelectorAll('.nav button')[1]);document.getElementById('esym').value=s;applyEventFilters();}})
setNav();refresh();setInterval(refresh,30000);
</script>
</body>
</html>
